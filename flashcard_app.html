<!DOCTYPE html>
<html lang="zh-TW" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <link rel="icon" href="icon.png" type="image/png">
    <meta name="apple-mobile-web-app-title" content="TOEIC Quest">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TOEIC Quest</title>
    <meta name="theme-color" content="#43257A">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Pixelify+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* === 復古像素遊戲風格（PICO-8 16 色盤） === */
        @font-face {
            /* 俐方體 11 號：繁體中文像素字型（SIL OFL），固定在特定版本 */
            font-family: 'Cubic 11';
            src: url('https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@4c566f7d6cc5c05ee360fe9cff56b5da1fcafd4d/fonts/web/Cubic_11.woff2') format('woff2');
            font-weight: 400; font-style: normal; font-display: swap;
        }

        :root {
            --font-pixel: 'Press Start 2P', 'Cubic 11', ui-monospace, monospace;   /* 標題、按鈕、數字 */
            --font-word: 'Pixelify Sans', 'Cubic 11', sans-serif;                  /* 卡片正面的大單字 */
            --font-body: 'Cubic 11', 'Pixelify Sans', "PingFang TC", "Microsoft JhengHei", sans-serif;

            --navy: #43257A; --black: #000000; --cream: #FFF1E8; --gray: #C2C3C7; --lav: #83769C;
            --plum: #7E2553; --red: #FF004D; --orange: #FFA300; --yellow: #FFEC27;
            --green: #00E436; --dgreen: #008751; --blue: #29ADFF; --pink: #FF77A8;

            /* 語意色（OK 綠 / 兩次 黃 / NO 與三次以上 紅），以 "r, g, b" 存放 */
            --ok-rgb: 0, 228, 54;
            --warn-rgb: 255, 236, 39;
            --no-rgb: 255, 0, 77;

            --text: var(--cream);
            --text-mute: var(--gray);
            --text-dim: var(--lav);
            --deco-rgb: 131, 118, 156;
            --deco-alpha: 0.55;
            --panel: rgba(0, 0, 0, 0.86);   /* 卡片的黑底，微微透出背景 */
        }

        * { box-sizing: border-box; }
        button { font-family: inherit; }
        body {
            margin: 0; background: var(--navy); color: var(--text); font-family: var(--font-body);
            display: flex; justify-content: center; align-items: flex-start; min-height: 100vh; overflow: hidden;
        }
        /* 背景：像素風遊戲主視覺（低解析度 canvas 放大，保持一格一格的邊緣） */
        #scene { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; height: 100dvh; z-index: 0; pointer-events: none; image-rendering: pixelated; image-rendering: crisp-edges; image-rendering: pixelated; }
        /* 映像管掃描線 */
        body::after {
            content: ''; position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 200; pointer-events: none;
            background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0, 0, 0, 0.10) 2px, rgba(0, 0, 0, 0.10) 4px);
        }
        :focus-visible { outline: 3px solid var(--yellow); outline-offset: 6px; }

        /* 背景星空：方形像素一格一格往上移 */
        #particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        #particles span { position: absolute; bottom: -10px; animation: rise steps(60) infinite; will-change: transform; }
        @keyframes rise { from { transform: translate(0, 0); } to { transform: translate(var(--dx), -110vh); } }

        /* 卡片兩側：轉 90 度、裁掉一半、只有外圈輪廓的單字裝飾（canvas 畫出文字外框） */
        .deco-word {
            position: fixed; top: 50%; z-index: 0; pointer-events: none; user-select: none;
            opacity: var(--deco-alpha);
            display: none;   /* 背景換成主視覺後先收起來，免得壓在城堡和月亮上；拿掉這行就會回來 */
        }
        .deco-left { left: 0; transform: translate(-50%, -50%) rotate(-90deg); }
        .deco-right { left: 100%; transform: translate(-50%, -50%) rotate(90deg); }
        .deco-in { animation: decoIn 0.4s steps(4) both; }
        @keyframes decoIn { from { opacity: 0; } to { opacity: var(--deco-alpha); } }

        #app-container {
            position: relative; z-index: 1;
            width: 100%; max-width: 600px; height: 100vh; height: 100dvh; max-height: 900px;
            display: flex; flex-direction: column; padding: 14px 20px 20px;
        }

        /* 像素外框：用 box-shadow 疊出缺角的方框（上下左右各一條）＋右下的硬陰影＋內側斜角
           --p 一格的大小、--bd 外框色、--sh 陰影色、--bevel 內側斜角色 */
        .card, .stat-chip, .icon-btn, .dropdown-menu, .btn-srs, .capsule-list, .list-empty, .capsule, .link-btn,
        .message-state, .stat-box, .btn-primary, .btn-outline, .modal-panel, .back-example-box, .xp-bar {
            --p: 4px; --bd: var(--cream); --sh: rgba(0, 0, 0, 0.5); --bevel: transparent;
            border: 0; border-radius: 0;
            box-shadow:
                inset calc(var(--p) * -1) calc(var(--p) * -1) 0 0 var(--bevel),
                0 calc(var(--p) * -1) 0 0 var(--bd), 0 var(--p) 0 0 var(--bd),
                calc(var(--p) * -1) 0 0 0 var(--bd), var(--p) 0 0 0 var(--bd),
                var(--p) calc(var(--p) * 2) 0 0 var(--sh), calc(var(--p) * 2) var(--p) 0 0 var(--sh);
        }

        .app-title {
            flex: 1 1 auto; min-width: 0; margin: 0; text-align: center;
            font-family: var(--font-pixel); font-weight: 400;
            font-size: 15px; letter-spacing: 0; line-height: 1.3; white-space: nowrap;
            cursor: pointer; user-select: none; -webkit-user-select: none;
            color: var(--yellow); text-shadow: 2px 2px 0 var(--red);
        }
        .app-title .t-short { display: none; }

        /* Header：左上 OK / NO 累積數字 */
        header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; gap: 12px; padding: 4px 4px 0; }
        .stat-counts { display: flex; align-items: center; gap: 14px; }
        .stat-chip {
            --c: var(--ok-rgb); --p: 3px; --bd: rgb(var(--c));
            appearance: none; -webkit-appearance: none; cursor: pointer;
            display: inline-flex; align-items: center; gap: 8px; padding: 5px 5px 5px 9px;
            background: var(--black); color: var(--text);
            font-family: var(--font-pixel); font-size: 11px; line-height: 1;
        }
        .stat-chip.stat-no { --c: var(--no-rgb); }
        body:not(.in-vocab) .stat-counts { display: none; }
        body:not(.in-vocab) .app-title { text-align: left; }
        .stat-chip .chip-num {
            min-width: 26px; height: 22px; padding: 0 6px; display: inline-flex; align-items: center; justify-content: center;
            background: rgb(var(--c)); color: var(--black); font-size: 11px;
        }
        .stat-chip:hover, .stat-chip.active { background: rgb(var(--c)); color: var(--black); }
        .stat-chip:hover .chip-num, .stat-chip.active .chip-num { background: var(--black); color: rgb(var(--c)); }
        .stat-chip:active { transform: translate(3px, 3px); --sh: transparent; }

        .header-actions { display: flex; align-items: center; gap: 14px; position: relative; flex-shrink: 0; }
        .icon-btn { --p: 3px; cursor: pointer; display: flex; align-items: center; justify-content: center; background: var(--black); width: 32px; height: 32px; color: var(--text); position: relative; }
        .icon-btn:hover { background: var(--blue); color: var(--black); }
        .icon-btn:active { transform: translate(3px, 3px); --sh: transparent; }
        .icon-btn svg { width: 18px; height: 18px; }
        /* 線條 icon 改成直角、不做平滑，看起來才像像素 */
        svg { shape-rendering: crispEdges; }
        svg, svg * { stroke-linecap: square; stroke-linejoin: miter; }

        /* Hamburger dropdown menu */
        .dropdown-menu { position: absolute; top: 46px; right: 0; background: var(--black); padding: 8px; display: flex; flex-direction: column; gap: 2px; min-width: 220px; z-index: 30; }
        .dropdown-menu.hidden { display: none; }
        .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 11px 10px; border: none; border-radius: 0; background: transparent; color: var(--text); font-size: 16px; cursor: pointer; text-align: left; width: 100%; }
        .dropdown-item::before { content: '▶'; font-size: 10px; color: var(--yellow); visibility: hidden; }
        .dropdown-item:hover { background: var(--navy); }
        .dropdown-item:hover::before { visibility: visible; }
        .dropdown-item svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--blue); }

        /* Main View State toggles */
        .view-section { display: none; flex: 1; min-height: 0; position: relative; }
        .view-section.active { display: flex; flex-direction: column; }

        /* Card Area（正反面同樣撐滿容器高度，翻轉前後等高） */
        #card-container { flex: 1; min-height: 0; position: relative; perspective: 1400px; width: 100%; }

        .card {
            display: flex; flex-direction: column; position: absolute;
            top: 4px; left: 4px; right: 8px; bottom: 8px; min-height: 320px;
            background: var(--panel);
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            transition: transform 0.4s steps(6);
        }

        .card-front { align-items: center; justify-content: center; z-index: 2; cursor: pointer; }
        /* RPG 對話框的內框線 */
        .card-front::before {
            content: ''; position: absolute; top: 10px; left: 10px; right: 10px; bottom: 10px; z-index: -1; pointer-events: none;
            border: 2px solid var(--navy);
        }
        .card-front.flipped { transform: rotateY(180deg); pointer-events: none; z-index: 0; }

        .card-back { color: var(--text); transform: rotateY(-180deg); z-index: 1; overflow: hidden; }
        .card-back.flipped { transform: rotateY(0deg); z-index: 3; }

        .loading-note { display: none; flex-direction: column; align-items: center; gap: 20px; color: var(--text-mute); font-size: 16px; }
        .card-front.loading .loading-note { display: flex; }
        .card-front.loading .front-word-group, .card-front.loading .front-hint { display: none; }
        .spinner { width: 22px; height: 22px; background: var(--yellow); animation: spin 0.8s steps(8) infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Front：英文單字放大 */
        .front-word-group {
            position: absolute; left: 50%; top: 46%; width: max-content; padding: 0 24px;
            transform: translate(-50%, calc(-50% - var(--dy, 0px)));
            font-family: var(--font-word); font-size: clamp(44px, 12vw, 72px); font-weight: 700;
            letter-spacing: 0; line-height: 1.05; text-align: center;
        }
        #front-word { color: var(--text); text-shadow: 4px 4px 0 var(--plum); cursor: pointer; display: block; }
        #front-word .w { display: inline-block; white-space: nowrap; }
        /* 打字機效果：字母一個一個出現 */
        #front-word .l { display: inline-block; animation: letterIn 0.01s step-start both; animation-delay: calc(var(--i) * 0.045s); }
        @keyframes letterIn { from { opacity: 0; } to { opacity: 1; } }
        .speaker-icon { width: 34px; height: 34px; flex-shrink: 0; color: var(--blue); cursor: pointer; transform: translateY(var(--dy, 0px)); }
        .speaker-icon:hover { color: var(--yellow); }
        .front-hint { position: absolute; bottom: 30px; font-size: 14px; color: var(--text-dim); display: flex; align-items: center; gap: 8px; animation: blink 1.2s steps(1) infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }
        .front-hint kbd { background: var(--cream); color: var(--black); padding: 4px 6px 3px; font-family: var(--font-pixel); font-size: 9px; line-height: 1; }

        /* Back */
        .card-content { padding: 28px 26px 18px; flex-grow: 1; overflow-y: auto; font-size: 17px; line-height: 1.7; }
        .back-translation { color: var(--yellow); font-size: 23px; line-height: 1.4; margin-bottom: 16px; }
        .back-forms, .back-collocations { color: var(--text-mute); font-size: 16px; margin-bottom: 12px; }
        .back-example-box { --p: 3px; --bd: var(--blue); --sh: transparent; background: var(--navy); padding: 14px 16px; margin: 20px 3px 6px; display: flex; gap: 12px; }
        .back-example-box .speaker-icon { margin-top: 3px; width: 22px; height: 22px; color: var(--yellow); }
        .back-example-box .speaker-icon:hover { color: var(--cream); }

        /* 像素捲軸 */
        .card-content, .capsule-list { scrollbar-width: thin; scrollbar-color: var(--lav) var(--black); }
        .card-content::-webkit-scrollbar, .capsule-list::-webkit-scrollbar { width: 10px; }
        .card-content::-webkit-scrollbar-track, .capsule-list::-webkit-scrollbar-track { background: var(--black); }
        .card-content::-webkit-scrollbar-thumb, .capsule-list::-webkit-scrollbar-thumb { background: var(--lav); border: 2px solid var(--black); }

        /* OK / NO 按鈕 */
        .srs-buttons { display: flex; gap: 22px; padding: 20px 22px 22px; background: transparent; border-top: 4px solid var(--cream); flex-shrink: 0; }
        .btn-srs {
            --sh: transparent; --bevel: rgba(0, 0, 0, 0.28);
            flex: 1; height: 52px; font-family: var(--font-pixel); font-size: 18px; line-height: 1; cursor: pointer;
            position: relative; overflow: visible;
        }
        .btn-ok { background: var(--green); color: var(--black); }
        .btn-no { background: var(--red); color: var(--cream); }
        .burst { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; background: var(--yellow); pointer-events: none; animation: burst 0.6s steps(6) forwards; }
        @keyframes burst { from { transform: translate(0, 0); opacity: 1; } to { transform: translate(var(--bx), var(--by)); opacity: 0; } }
        .btn-srs:hover { filter: brightness(1.12); }
        .btn-srs:active { transform: translate(2px, 2px); --bevel: transparent; }

        /* OK 單字列表 */
        .list-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 8px 16px; margin: 0 4px 16px; flex-shrink: 0; }
        .list-title { margin: 0; font-weight: 400; font-size: 22px; color: var(--yellow); text-shadow: 2px 2px 0 var(--red); }
        .legend { display: flex; align-items: center; gap: 14px; font-size: 13px; color: var(--text-mute); }
        .legend-item { display: inline-flex; align-items: center; gap: 6px; }
        .dot { width: 10px; height: 10px; display: inline-block; }
        .dot-green { background: rgb(var(--ok-rgb)); }
        .dot-yellow { background: rgb(var(--warn-rgb)); }
        .dot-red { background: rgb(var(--no-rgb)); }
        .capsule-list {
            flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-wrap: wrap; align-content: flex-start; gap: 14px;
            padding: 18px; margin: 4px 8px 8px 4px; background: var(--panel);
        }
        .list-empty { flex: 1; align-items: center; justify-content: center; display: flex; text-align: center; color: var(--text-mute); padding: 20px; margin: 4px 8px 8px 4px; background: var(--panel); }
        .list-empty.hidden { display: none; }
        .capsule {
            --c: var(--ok-rgb); --p: 2px; --bd: rgb(var(--c)); --sh: transparent;
            appearance: none; -webkit-appearance: none; cursor: pointer; padding: 6px 12px;
            background: var(--black); color: var(--text);
            font-family: var(--font-word); font-weight: 600; font-size: 17px; line-height: 1.2;
            max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .capsule.cap-yellow { --c: var(--warn-rgb); }
        .capsule.cap-red { --c: var(--no-rgb); }
        .capsule:hover { background: rgb(var(--c)); color: var(--black); }

        /* 底部列：模式提示 + 進度條 */
        .bottom-bar { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; margin-top: 16px; min-height: 28px; flex-shrink: 0; }
        .bottom-bar.hidden { display: none; }
        .mode-label { font-size: 14px; color: var(--text-mute); }
        /* 經驗值條：背過的新單字比例 */
        .xp-bar { --p: 2px; --sh: transparent; width: 100%; max-width: 300px; height: 12px; background: var(--black); padding: 2px; }
        .xp-bar i { display: block; height: 100%; width: 0; background: repeating-linear-gradient(90deg, var(--green) 0, var(--green) 8px, var(--black) 8px, var(--black) 10px); }
        .link-btn { --p: 3px; cursor: pointer; height: 30px; padding: 0 12px; display: inline-flex; align-items: center; background: var(--black); color: var(--text); font-size: 14px; }
        .link-btn:hover { background: var(--cream); color: var(--black); }
        .link-btn:active { transform: translate(3px, 3px); --sh: transparent; }

        /* Empty / End state */
        .message-state { align-items: center; justify-content: center; background: var(--panel); text-align: center; padding: 40px 28px; margin: 4px 8px 8px 4px; flex-direction: column; }
        .message-state h2 { font-weight: 400; font-size: 30px; margin: 0 0 12px; color: var(--yellow); text-shadow: 3px 3px 0 var(--red); }
        .message-state p { color: var(--text-mute); margin: 0 0 26px; line-height: 1.7; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; margin-bottom: 34px; width: 100%; max-width: 300px; }
        .stat-box { --c: var(--ok-rgb); --p: 3px; --bd: rgb(var(--c)); --sh: transparent; padding: 20px 12px 16px; background: var(--black); color: rgb(var(--c)); font-family: var(--font-pixel); font-size: 26px; line-height: 1.1; }
        .stat-box.no-bg { --c: var(--no-rgb); }
        .stat-box span { display: block; font-size: 11px; margin-top: 12px; color: var(--text-mute); }

        .btn-primary { --sh: transparent; --bevel: rgba(0, 0, 0, 0.25); background: var(--yellow); color: var(--black); padding: 14px 20px; font-size: 17px; cursor: pointer; margin: 10px; width: 250px; }
        .btn-primary:hover { filter: brightness(1.1); }
        .btn-outline { --sh: transparent; background: var(--black); color: var(--text); padding: 14px 20px; font-size: 17px; cursor: pointer; margin: 10px; width: 250px; }
        .btn-outline:hover { background: var(--cream); color: var(--black); }
        .btn-primary:active, .btn-outline:active { transform: translate(2px, 2px); --bevel: transparent; }

        /* 對話框 */
        .modal { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 100; display: flex; align-items: center; justify-content: center; padding: 24px; background: rgba(0, 0, 0, 0.72); }
        .modal-panel { width: 100%; max-width: 340px; text-align: center; padding: 30px 26px 28px; background: var(--black); animation: modalPop 0.2s steps(4); }
        .modal-icon { font-size: 42px; line-height: 1; margin-bottom: 14px; }
        .modal-panel h3 { margin: 0 0 10px; font-weight: 400; font-size: 24px; color: var(--yellow); text-shadow: 2px 2px 0 var(--red); }
        .modal-panel p { margin: 0 0 26px; color: var(--text-mute); line-height: 1.7; }
        .modal-panel .btn-primary { width: calc(100% - 8px); margin: 0 4px; }
        @keyframes modalPop { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: none; } }

        /* === 闖關地圖 === */
        .map-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 8px 8px 4px; scrollbar-width: thin; scrollbar-color: var(--lav) transparent; }
        .map-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 0 4px 18px; }
        .map-title { margin: 0; font-weight: 400; font-size: 22px; color: var(--yellow); text-shadow: 2px 2px 0 var(--red); }
        .map-lv { font-family: var(--font-pixel); font-size: 11px; color: var(--cream); text-shadow: 2px 2px 0 var(--black); white-space: nowrap; }
        .region { margin-bottom: 22px; }
        .region-name { display: inline-block; margin: 0 0 12px 4px; padding: 5px 10px 4px; background: var(--plum); color: var(--cream); font-size: 14px; box-shadow: 3px 3px 0 var(--black); }
        .stage {
            --p: 3px; --bd: var(--cream); --sh: rgba(0, 0, 0, 0.5); --bevel: transparent;
            border: 0; border-radius: 0;
            box-shadow:
                0 calc(var(--p) * -1) 0 0 var(--bd), 0 var(--p) 0 0 var(--bd),
                calc(var(--p) * -1) 0 0 0 var(--bd), var(--p) 0 0 0 var(--bd),
                var(--p) calc(var(--p) * 2) 0 0 var(--sh), calc(var(--p) * 2) var(--p) 0 0 var(--sh);
            appearance: none; -webkit-appearance: none; cursor: pointer; text-align: left;
            display: flex; align-items: center; gap: 14px; width: calc(100% - 10px); margin: 0 6px 16px 4px; padding: 12px 14px;
            background: var(--panel); color: var(--text); font-size: 15px;
        }
        .stage:hover { background: rgba(29, 43, 83, 0.92); }
        .stage:active { transform: translate(3px, 3px); --sh: transparent; }
        .stage-no { flex-shrink: 0; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: var(--blue); color: var(--black); font-family: var(--font-pixel); font-size: 12px; }
        .stage-body { flex: 1; min-width: 0; }
        .stage-title { display: block; font-size: 17px; color: var(--cream); }
        .stage-sub { display: block; font-size: 13px; color: var(--text-mute); margin-top: 3px; }
        .stage-tag { flex-shrink: 0; font-size: 12px; padding: 4px 7px 3px; background: var(--black); color: var(--text-mute); }
        .stage.is-clear .stage-no { background: var(--green); }
        .stage.is-clear .stage-tag { color: var(--yellow); background: transparent; font-size: 15px; letter-spacing: 1px; }
        .stage.is-rec { --bd: var(--yellow); }
        .stage.is-rec .stage-tag { background: var(--yellow); color: var(--black); }
        .stage.is-soon, .stage.is-lock { cursor: default; --bd: var(--lav); }
        .stage.is-soon .stage-no, .stage.is-lock .stage-no { background: var(--lav); }
        .stage.is-soon .stage-title, .stage.is-lock .stage-title { color: var(--text-mute); }
        .stage.is-soon:active, .stage.is-lock:active { transform: none; --sh: rgba(0, 0, 0, 0.5); }
        .stage.is-soon:hover, .stage.is-lock:hover { background: var(--panel); }
        .stage.is-wrong .stage-no { background: var(--red); color: var(--cream); }

        /* === 章節、課程、測驗 === */
        .course-panel {
            --p: 4px; --bd: var(--cream); --sh: rgba(0, 0, 0, 0.5);
            box-shadow:
                0 calc(var(--p) * -1) 0 0 var(--bd), 0 var(--p) 0 0 var(--bd),
                calc(var(--p) * -1) 0 0 0 var(--bd), var(--p) 0 0 0 var(--bd),
                var(--p) calc(var(--p) * 2) 0 0 var(--sh), calc(var(--p) * 2) var(--p) 0 0 var(--sh);
            flex: 1; min-height: 0; margin: 4px 8px 8px 4px; background: var(--panel);
            display: flex; flex-direction: column;
        }
        .course-body { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 24px 18px; font-size: 16px; line-height: 1.7; scrollbar-width: thin; scrollbar-color: var(--lav) var(--black); }
        .course-foot { flex-shrink: 0; display: flex; gap: 16px; padding: 16px 20px 20px; border-top: 4px solid var(--cream); }
        .course-foot:empty { display: none; }
        .course-foot .btn-primary, .course-foot .btn-outline { flex: 1; width: auto; margin: 4px; padding: 12px 10px; font-size: 16px; }
        .c-kicker { font-size: 13px; color: var(--blue); margin-bottom: 6px; }
        .c-title { margin: 0 0 16px; font-weight: 400; font-size: 23px; line-height: 1.4; color: var(--yellow); }
        .c-text { color: var(--text-mute); margin: 0 0 14px; }
        .c-points { list-style: none; margin: 0 0 18px; padding: 0; }
        .c-points li { position: relative; padding-left: 20px; margin-bottom: 10px; }
        .c-points li::before { content: '▶'; position: absolute; left: 0; top: 1px; font-size: 10px; color: var(--yellow); }
        .c-box { --p: 3px; --bd: var(--blue); --sh: transparent; background: rgba(29, 43, 83, 0.85); padding: 14px 16px; margin: 6px 3px 10px; }
        .c-box .en { color: var(--cream); }
        .c-box .zh { color: var(--text-mute); font-size: 15px; margin-top: 6px; }
        .c-dots { display: flex; gap: 6px; margin-bottom: 18px; }
        .c-dots i { width: 14px; height: 6px; background: var(--lav); }
        .c-dots i.on { background: var(--yellow); }

        .steps { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
        .step-btn { --p: 3px; --sh: rgba(0, 0, 0, 0.5); width: calc(100% - 10px); margin: 0 6px 16px 4px; display: flex; align-items: center; gap: 12px; padding: 14px; background: var(--black); color: var(--text); cursor: pointer; text-align: left; font-size: 16px; }
        .step-btn:hover { background: var(--navy); }
        .step-btn:active { transform: translate(3px, 3px); --sh: transparent; }
        .step-btn .s-ico { font-size: 20px; width: 26px; text-align: center; }
        .step-btn .s-main { flex: 1; }
        .step-btn .s-sub { display: block; font-size: 13px; color: var(--text-mute); }
        .step-btn .s-state { font-size: 13px; color: var(--green); }

        /* 題目 */
        .q-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; font-size: 14px; color: var(--text-mute); }
        .q-count { font-family: var(--font-pixel); font-size: 11px; color: var(--cream); white-space: nowrap; }
        .q-timer { flex: 1; height: 12px; background: var(--black); box-shadow: 0 0 0 2px var(--lav); padding: 2px; }
        .q-timer i { display: block; height: 100%; width: 100%; background: repeating-linear-gradient(90deg, var(--yellow) 0, var(--yellow) 8px, var(--black) 8px, var(--black) 10px); }
        .q-timer.low i { background: repeating-linear-gradient(90deg, var(--red) 0, var(--red) 8px, var(--black) 8px, var(--black) 10px); }
        .q-sec { font-family: var(--font-pixel); font-size: 11px; min-width: 30px; text-align: right; color: var(--cream); }
        .q-passage { white-space: pre-wrap; background: rgba(29, 43, 83, 0.85); padding: 14px 16px; margin: 0 3px 18px; font-size: 15px; line-height: 1.65; max-height: 38vh; overflow-y: auto; --p: 3px; --bd: var(--lav); --sh: transparent; box-shadow: 0 -3px 0 0 var(--lav), 0 3px 0 0 var(--lav), -3px 0 0 0 var(--lav), 3px 0 0 0 var(--lav); }
        .q-passage .blank { background: var(--yellow); color: var(--black); padding: 0 4px; }
        .q-passage .mark { color: var(--yellow); }
        .q-passage .p-title { display: block; color: var(--blue); font-size: 13px; margin-bottom: 6px; }
        .q-text { font-size: 18px; color: var(--cream); margin: 0 0 18px; white-space: pre-line; }
        /* Part 3/4：一段對話對應多題，題目預覽＋圖表 */
        .q-talk { white-space: normal; max-height: none; }
        .q-talk .t-qs { margin: 0; padding-left: 22px; color: var(--text-mute); font-size: 14px; }
        .q-talk .t-qs li { margin-bottom: 4px; }
        .q-talk .t-qs li.on { color: var(--yellow); }
        .q-talk .t-qs li.done { opacity: 0.55; }
        .q-chart { margin: 0 0 14px; }
        .q-chart .c-cap { color: var(--cream); font-size: 14px; margin-bottom: 6px; }
        .q-chart .n-table { margin: 0; }
        .q-chart .bars { display: flex; flex-direction: column; gap: 6px; font-size: 14px; }
        .q-chart .bar-row { display: flex; align-items: center; gap: 8px; }
        .q-chart .bar-row .lb { width: 8.5em; flex-shrink: 0; color: var(--text); }
        .q-chart .bar-row .bv { height: 14px; background: var(--blue); }
        .q-chart .bar-row .nv { font-family: var(--font-pixel); font-size: 10px; color: var(--cream); }
        .q-exp details { margin-top: 10px; }
        .q-exp summary { cursor: pointer; color: var(--blue); }
        .q-exp .tr .sp { color: var(--yellow); }
        .q-play { --p: 3px; --sh: transparent; display: inline-flex; align-items: center; gap: 8px; margin: 0 0 18px 3px; padding: 10px 14px; background: var(--blue); color: var(--black); cursor: pointer; font-size: 15px; }
        .opts { display: flex; flex-direction: column; gap: 4px; }
        .opt { --p: 3px; --bd: var(--cream); --sh: transparent; width: calc(100% - 6px); margin: 0 3px 12px; display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; background: var(--black); color: var(--text); text-align: left; cursor: pointer; font-family: var(--font-word); font-size: 17px; line-height: 1.45; }
        .opt .k { flex-shrink: 0; font-family: var(--font-pixel); font-size: 11px; color: var(--yellow); margin-top: 5px; }
        .opt:hover:not(:disabled) { background: var(--navy); }
        .opt:disabled { cursor: default; }
        .opt.right { --bd: var(--green); background: rgba(0, 135, 81, 0.55); }
        .opt.wrong { --bd: var(--red); background: rgba(126, 37, 83, 0.75); }
        .opt.dim { opacity: 0.5; }
        .q-exp { margin-top: 8px; padding: 14px 16px; background: rgba(29, 43, 83, 0.85); font-size: 15px; }
        .q-exp b { display: block; margin-bottom: 4px; font-weight: 400; }
        .q-exp.ok b { color: var(--green); }
        .q-exp.ng b { color: var(--red); }
        .q-exp .tr { color: var(--text-mute); margin-top: 8px; white-space: pre-wrap; }
        .q-exp .zh-line { margin-top: 10px; padding-top: 10px; border-top: 2px solid var(--lav); color: var(--cream); }
        .q-exp .zh-line b { display: inline; color: var(--blue); margin-right: 8px; }
        .opt .oz { display: block; font-family: var(--font-body); font-size: 13px; color: var(--text-mute); margin-top: 2px; }

        /* 結果 */
        .r-score { font-family: var(--font-pixel); font-size: 30px; color: var(--cream); margin: 6px 0 4px; text-shadow: 3px 3px 0 var(--plum); }
        .r-badge { display: inline-block; margin: 8px 0 18px; padding: 6px 10px 5px; font-size: 15px; }
        .r-badge.pass { background: var(--green); color: var(--black); }
        .r-badge.fail { background: var(--red); color: var(--cream); }
        .r-table { width: 100%; border-collapse: collapse; margin: 6px 0 18px; font-size: 15px; }
        .r-table th, .r-table td { padding: 8px 6px; border-bottom: 2px solid var(--navy); text-align: left; }
        .r-table th { color: var(--text-dim); font-weight: 400; font-size: 13px; }
        .r-table td.num { font-family: var(--font-pixel); font-size: 11px; white-space: nowrap; }
        .r-bar { display: inline-block; width: 60px; height: 8px; background: var(--black); vertical-align: middle; margin-right: 8px; }
        .r-bar i { display: block; height: 100%; }
        .r-rec { margin: 0 0 6px; padding-left: 20px; position: relative; }
        .r-rec::before { content: '!'; position: absolute; left: 4px; color: var(--yellow); }

        /* 講義 */
        .n-toc { margin: 0 0 22px; padding: 12px 14px; background: rgba(29, 43, 83, 0.85); }
        .n-toc a { display: block; padding: 5px 0; color: var(--blue); text-decoration: none; font-size: 15px; cursor: pointer; }
        .n-toc a:hover { color: var(--yellow); }
        .n-toc a span { font-family: var(--font-pixel); font-size: 10px; color: var(--text-dim); margin-right: 8px; }
        .n-sec { margin: 0 0 34px; scroll-margin-top: 10px; }
        .n-sec h3 { margin: 0 0 12px; padding-bottom: 8px; border-bottom: 3px solid var(--plum); font-weight: 400; font-size: 20px; color: var(--yellow); }
        .n-sec h3 span { font-family: var(--font-pixel); font-size: 11px; color: var(--pink); margin-right: 10px; }
        .n-sec p { margin: 0 0 12px; color: var(--text); }
        .n-table { width: 100%; border-collapse: collapse; margin: 4px 0 16px; font-size: 14px; line-height: 1.55; }
        .n-table th { background: var(--plum); color: var(--cream); font-weight: 400; text-align: left; padding: 7px 8px; }
        .n-table td { padding: 8px; border-bottom: 2px solid var(--navy); vertical-align: top; color: var(--text); min-width: 4.5em; }
        .n-table tr:nth-child(even) td { background: rgba(29, 43, 83, 0.45); }
        .n-wrap { overflow-x: auto; }
        .n-steps { margin: 0 0 16px; padding-left: 22px; }
        .n-steps li { margin-bottom: 8px; }
        .n-steps li::marker { color: var(--yellow); font-family: var(--font-pixel); font-size: 10px; }
        .n-ex { display: flex; gap: 10px; margin: 0 3px 12px; padding: 12px 14px; background: rgba(29, 43, 83, 0.85); box-shadow: -3px 0 0 0 var(--blue); }
        .n-ex .say { flex-shrink: 0; cursor: pointer; color: var(--yellow); background: none; border: 0; padding: 0; font-size: 16px; line-height: 1.5; }
        .n-ex .en { color: var(--cream); }
        .n-ex .zh { color: var(--text-mute); font-size: 14px; margin-top: 4px; }
        .n-tip { margin: 6px 3px 0; padding: 12px 14px; background: rgba(126, 37, 83, 0.6); font-size: 15px; }
        .n-tip b { color: var(--yellow); font-weight: 400; margin-right: 6px; }

        @media (max-width: 480px) {
            .course-body { padding: 20px 18px 14px; }
            .course-foot { padding: 14px 14px 16px; gap: 10px; }
            .c-title { font-size: 20px; }
            .q-text { font-size: 17px; }
        }

        .hidden { display: none !important; }

        @media (prefers-reduced-motion: reduce) {
            #particles span, .front-hint, .spinner, #front-word .l, .modal-panel, .deco-in { animation: none; }
            .card { transition: none; }
        }

        @media (max-width: 480px) {
            #app-container { padding: 12px 16px 16px; }
            .app-title { font-size: 12px; }
            .app-title .t-full { display: none; }
            .app-title .t-short { display: inline; }
            header.has-back .app-title { display: none; }
            .btn-srs { font-size: 16px; height: 50px; }
            .srs-buttons { gap: 18px; padding: 18px 18px 20px; }
            .card-content { padding: 22px 20px 14px; }
            .back-translation { font-size: 21px; }
            .legend { gap: 10px; }
        }
    </style>
</head>
<body>
    <canvas id="scene" aria-hidden="true"></canvas>
    <div id="particles" aria-hidden="true"></div>
    <canvas class="deco-word deco-left" id="deco-left" aria-hidden="true"></canvas>
    <canvas class="deco-word deco-right" id="deco-right" aria-hidden="true"></canvas>

    <div id="app-container">
        <!-- Header：左上 OK / NO 累積數字（點 NO 進入 NO 單字庫複習、點 OK 看已背完的單字） -->
        <header>
            <div class="stat-counts">
                <button class="stat-chip stat-ok" id="stat-ok-btn" title="已背完的 OK 單字"><span>OK</span><span class="chip-num" id="stat-ok">0</span></button>
                <button class="stat-chip stat-no" id="stat-no-btn" title="複習 NO 單字庫"><span>NO</span><span class="chip-num" id="stat-no">0</span></button>
            </div>
            <h1 class="app-title" id="app-title" title="回到新單字" aria-label="TOEIC Quest"><span>TOEIC</span> <span class="t-full">Quest</span><span class="t-short">Quest</span></h1>
            <div class="header-actions">
                <button class="link-btn hidden" id="btn-back">‹ 返回</button>
                <div class="icon-btn" id="btn-menu" title="選單">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </div>
                <div class="dropdown-menu hidden" id="dropdown-menu">
                    <button class="dropdown-item" id="btn-cloud" title="雲端同步">
                        <svg id="icon-cloud-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/></svg>
                        <svg id="icon-cloud-on" class="hidden" viewBox="0 0 24 24" fill="none" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.5 19H9a7 7 0 1 1 6.71-9h1.79a4.5 4.5 0 1 1 0 9Z"/><polyline points="9 15 11 17 15 11"/></svg>
                        <span>雲端同步</span>
                    </button>
                    <button class="dropdown-item" id="btn-shuffle" title="打亂剩下卡片的順序">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="16 3 21 3 21 8"></polyline><line x1="4" y1="20" x2="21" y2="3"></line><polyline points="21 16 21 21 16 21"></polyline><line x1="15" y1="15" x2="21" y2="21"></line><line x1="4" y1="4" x2="9" y2="9"></line></svg>
                        <span>打亂順序</span>
                    </button>
                    <button class="dropdown-item" id="btn-info" title="使用說明">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                        <span>使用說明</span>
                    </button>
                </div>
            </div>
        </header>

        <!-- View: Main Card -->
        <div id="view-card" class="view-section active">
            <div id="card-container">
                <!-- Front -->
                <div class="card card-front loading" id="card-front">
                    <div class="loading-note"><span class="spinner"></span><span>正在載入單字庫…</span></div>
                    <div class="front-word-group" id="front-word-group">
                        <span id="front-word"></span>
                    </div>
                    <div class="front-hint">
                        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        點擊卡片 或按 <kbd>SPACE</kbd> 顯示答案
                    </div>
                </div>
                <!-- Back -->
                <div class="card card-back" id="card-back">
                    <div class="card-content">
                        <div class="back-translation" id="back-translation"></div>
                        <div class="back-forms" id="back-forms"></div>
                        <div class="back-collocations" id="back-collocations"></div>
                        <div class="back-example-box" id="back-example-box">
                            <div class="speaker-icon" id="btn-speak-back">
                                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
                            </div>
                            <div id="back-example-text"></div>
                        </div>
                    </div>
                    <div class="srs-buttons">
                        <button class="btn-srs btn-ok" data-action="ok">OK</button>
                        <button class="btn-srs btn-no" data-action="no">NO</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- View: OK 單字列表 -->
        <div id="view-ok" class="view-section">
            <div class="list-head">
                <h2 class="list-title">OK 單字</h2>
                <div class="legend">
                    <span class="legend-item"><i class="dot dot-green"></i>一次</span>
                    <span class="legend-item"><i class="dot dot-yellow"></i>兩次</span>
                    <span class="legend-item"><i class="dot dot-red"></i>三次以上</span>
                </div>
            </div>
            <div id="ok-empty" class="list-empty hidden">還沒有 OK 的單字，先去背幾個吧！</div>
            <div id="ok-list" class="capsule-list"></div>
        </div>

        <!-- View: End / Empty State -->
        <div id="view-message" class="view-section message-state">
            <h2 id="msg-title">準備開始學習！</h2>
            <p id="msg-desc">正在載入單字庫...</p>

            <div id="msg-stats" class="stats-grid hidden">
                <div class="stat-box" id="end-stat-ok">0<span>OK</span></div>
                <div class="stat-box no-bg" id="end-stat-no">0<span>NO</span></div>
            </div>

            <button class="btn-primary hidden" id="btn-review-no">複習 NO 單字</button>
            <button class="btn-outline hidden" id="btn-restart">重新開始 (隨機打亂)</button>
            <button class="btn-outline" id="btn-import-large">匯入新檔</button>
        </div>

        <!-- View: 闖關地圖（首頁） -->
        <div id="view-map" class="view-section">
            <div class="map-head"><h2 class="map-title">冒險地圖</h2><span class="map-lv" id="map-lv"></span></div>
            <div class="map-scroll" id="map-list"></div>
        </div>

        <!-- View: 章節／重點卡／題目／結果 -->
        <div id="view-course" class="view-section">
            <div class="course-panel">
                <div class="course-body" id="course-body"></div>
                <div class="course-foot" id="course-foot"></div>
            </div>
        </div>

        <!-- 底部列：目前模式 + 返回 -->
        <div class="bottom-bar hidden" id="bottom-bar">
            <span class="mode-label" id="mode-label"></span>
            <div class="xp-bar hidden" id="xp-bar" aria-hidden="true"><i id="xp-fill"></i></div>
        </div>

        <input type="file" id="csv-upload" accept=".csv" style="display: none;">
    </div>

    <!-- 對話框：需要按「確認」才會關閉 -->
    <div class="modal hidden" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
        <div class="modal-panel">
            <div class="modal-icon" id="dialog-icon"></div>
            <h3 id="dialog-title"></h3>
            <p id="dialog-msg"></p>
            <button class="btn-primary" id="dialog-ok">確認</button>
        </div>
    </div>

    <!-- Firebase JS SDKs (ES Modules) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBUoksOXY-M4WTxMTj61lYfTlVpwXyGhLY",
            authDomain: "toeicflashcards.firebaseapp.com",
            projectId: "toeicflashcards",
            storageBucket: "toeicflashcards.firebasestorage.app",
            messagingSenderId: "848429691433",
            appId: "1:848429691433:web:8fefa788bf54fb990de238"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let syncId = localStorage.getItem('srs_sync_id') || null;

        const $ = id => document.getElementById(id);

        /* === State & IndexedDB (Local Fallback) === */
        const DB_NAME = "FlashcardDB";
        const DB_VERSION = 1;
        const STORE_NAME = "srs_state";

        // 每個單字只會待在下面三個清單其中之一：
        //   pending = 還沒判過的新字（洗牌後的順序）
        //   noIds   = NO 單字庫（按過 NO、還沒背起來）
        //   okIds   = OK 單字（背完了，依完成順序）
        // noCount[id] = 這個字按過幾次 NO，用來決定 OK 列表膠囊的顏色（0 綠 / 1 黃 / 2+ 紅）
        function emptyState() {
            return { cards: [], pending: [], noIds: [], okIds: [], noCount: {}, totalImported: 0 };
        }
        let appState = emptyState();

        // 只存在畫面上、不需要存檔的狀態
        const ui = { view: 'card', loading: true, dialog: false, decoWord: '', mode: 'new', side: 'front', reviewId: null, okScroll: 0 };
        // mode: 'new' 依序看新字 / 'no' 複習 NO 單字庫 / 'ok' 從 OK 列表打開單張複習

        /* === 存檔格式相容：舊版（queue / reviewIds / stats）→ 新版（pending / noIds / okIds） === */
        function legacyToNew(queue, pending, reviewIds, total) {
            const inFlight = new Set([...queue, ...pending]);
            const noSet = new Set(reviewIds);
            const noIds = reviewIds.filter(id => inFlight.has(id));
            const freshPending = queue.filter(id => !noSet.has(id)).concat(pending.filter(id => !noSet.has(id)));
            const okIds = [];
            for (let id = 0; id < total; id++) if (!inFlight.has(id)) okIds.push(id);
            const noCount = {};
            noIds.forEach(id => { noCount[id] = 1; });
            return { pending: freshPending, noIds, okIds, noCount };
        }

        function normalizeState(raw) {
            const cards = Array.isArray(raw.cards) ? raw.cards : [];
            const total = raw.totalImported || cards.length;
            let core;
            if (Array.isArray(raw.noIds) && Array.isArray(raw.okIds)) {
                core = {
                    pending: Array.isArray(raw.pending) ? raw.pending : [],
                    noIds: raw.noIds,
                    okIds: raw.okIds,
                    noCount: (raw.noCount && typeof raw.noCount === 'object') ? raw.noCount : {}
                };
            } else {
                core = legacyToNew(raw.queue || [], raw.pending || [], raw.reviewIds || [], total);
            }
            return { cards, totalImported: total, vocabSig: raw.vocabSig, ...core };
        }

        // 保證每個單字剛好在一個清單裡，並剔除超出單字庫範圍的 id
        function sanitizeState() {
            const n = appState.cards.length;
            if (!n) return;
            const seen = new Set();
            const clean = arr => arr.filter(id => Number.isInteger(id) && id >= 0 && id < n && !seen.has(id) && (seen.add(id), true));
            appState.noIds = clean(appState.noIds);
            appState.okIds = clean(appState.okIds);
            appState.pending = clean(appState.pending);
            for (let id = 0; id < n; id++) if (!seen.has(id)) appState.pending.push(id);
            const nc = {};
            Object.keys(appState.noCount).forEach(k => {
                const v = Number(appState.noCount[k]);
                if (v > 0 && seen.has(Number(k))) nc[k] = v;
            });
            appState.noCount = nc;
            appState.totalImported = n;
        }

        function openDB() {
            return new Promise((resolve, reject) => {
                const req = indexedDB.open(DB_NAME, DB_VERSION);
                req.onupgradeneeded = e => {
                    const db = e.target.result;
                    if (!db.objectStoreNames.contains(STORE_NAME)) {
                        db.createObjectStore(STORE_NAME);
                    }
                };
                req.onsuccess = () => resolve(req.result);
                req.onerror = () => reject(req.error);
            });
        }

        async function saveStateLocal(state) {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).put(state, "appState");
                return new Promise(r => tx.oncomplete = r);
            } catch (e) {
                localStorage.setItem('srs_state', JSON.stringify(state));
            }
        }

        async function loadStateLocal() {
            try {
                const db = await openDB();
                const tx = db.transaction(STORE_NAME, "readonly");
                const req = tx.objectStore(STORE_NAME).get("appState");
                return new Promise(resolve => {
                    req.onsuccess = () => resolve(req.result);
                    req.onerror = () => resolve(null);
                });
            } catch (e) {
                const data = localStorage.getItem('srs_state');
                return data ? JSON.parse(data) : null;
            }
        }

        /* === Utilities === */
        function shuffleArray(array) {
            let shuffled = [...array];
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }
            return shuffled;
        }

        /* === Cloud Sync Logic === */
        async function saveToCloud() {
            if (!syncId) return;
            try {
                await setDoc(doc(db, "flashcards_sync", syncId), {
                    pending: appState.pending,
                    noIds: appState.noIds,
                    okIds: appState.okIds,
                    noCountJson: JSON.stringify(appState.noCount),
                    totalImported: appState.totalImported,
                    vocabSig: appState.vocabSig || null,
                    courseJson: JSON.stringify(course),
                    updatedAt: Date.now()
                });
            } catch(e) {
                console.error("Cloud save failed", e);
            }
        }

        async function loadFromCloud(id) {
            try {
                const docSnap = await getDoc(doc(db, "flashcards_sync", id));
                if (!docSnap.exists()) return false;
                const data = docSnap.data();
                mergeCloudCourse(data.courseJson);   // 課程進度和單字庫無關，先接回來
                // 雲端進度是用單字編號記的，單字庫換過就對不上，不能套用
                if ((data.vocabSig || null) !== (appState.vocabSig || null)) return false;
                let noCount = {};
                if (typeof data.noCountJson === 'string') {
                    try { noCount = JSON.parse(data.noCountJson) || {}; } catch (e) {}
                }
                appState = normalizeState({
                    cards: appState.cards,
                    vocabSig: appState.vocabSig,
                    totalImported: data.totalImported || appState.totalImported,
                    pending: data.pending, noIds: data.noIds, okIds: data.okIds, noCount,
                    queue: data.queue, reviewIds: data.reviewIds
                });
                sanitizeState();
                await saveStateLocal(appState);
                return true;
            } catch(e) {
                console.error("Cloud load failed", e);
                return false;
            }
        }

        async function updateState() {
            await saveStateLocal(appState);
            if (syncId) {
                saveToCloud(); // fire and forget
            }
        }

        /* === CSV Parsing === */
        function parseCSV(str) {
            var arr = [];
            var quote = false;
            var row = 0, col = 0;
            for (var c = 0; c < str.length; c++) {
                var cc = str[c], nc = str[c+1];
                arr[row] = arr[row] || [];
                arr[row][col] = arr[row][col] || '';
                if (cc == '"' && quote && nc == '"') { arr[row][col] += cc; ++c; continue; }
                if (cc == '"') { quote = !quote; continue; }
                if (cc == ',' && !quote) { ++col; continue; }
                if (cc == '\r' && nc == '\n' && !quote) { ++row; col = 0; ++c; continue; }
                if (cc == '\n' && !quote) { ++row; col = 0; continue; }
                if (cc == '\r' && !quote) { ++row; col = 0; continue; }
                arr[row][col] += cc;
            }
            return arr.filter(r => r.length >= 2 && r[0].trim() !== '');
        }

        function parseCardText(text) {
            let translation = [];
            let wordForms = [];
            let collocations = [];
            let example = [];

            let currentBlock = "translation";
            const lines = text.split('\n');
            for (let line of lines) {
                let tLine = line.trim();
                if(!tLine) continue;

                if (tLine.includes("【詞性變化】") || tLine.includes("衍生字")) { currentBlock = "forms"; continue; }
                if (tLine.includes("【搭配詞】") || tLine.includes("【考試重點")) { currentBlock = "collocations"; continue; }
                if (tLine.includes("【例句】")) { currentBlock = "example"; continue; }

                if (currentBlock === "translation") translation.push(tLine);
                else if (currentBlock === "forms") wordForms.push(tLine);
                else if (currentBlock === "collocations") collocations.push(tLine);
                else if (currentBlock === "example") example.push(tLine);
            }

            let exampleEng = "";
            if (example.length > 0) {
                let exText = example.join('<br>');
                let pIndex = exText.indexOf('(');
                if (pIndex === -1) pIndex = exText.indexOf('（');
                if (pIndex !== -1) {
                    exampleEng = exText.substring(0, pIndex).trim();
                } else {
                    exampleEng = exText;
                }
            }

            return {
                translation: translation.join('<br>'),
                wordForms: wordForms.join('<br>'),
                collocations: collocations.join('<br>'),
                example: example.join('<br>'),
                exampleEng: exampleEng.replace(/<br>/g, ' ')
            };
        }

        // 把 [單字, 內容] 的列載入成單字卡並套用到 appState，手動匯入與預先載入共用這份邏輯
        // 單字庫的指紋：內建單字表一改，就會和存檔裡的不同，用來判斷要不要換新單字
        function vocabSignature(rows) {
            const text = rows.map(r => r[0].trim()).join('\n');
            let h = 5381;
            for (let i = 0; i < text.length; i++) h = ((h * 33) ^ text.charCodeAt(i)) >>> 0;
            return rows.length + '-' + h.toString(36);
        }

        // sig：內建單字庫傳 vocabSignature(rows)；使用者自己匯入的 CSV 傳 'custom'（不會被自動換掉）
        async function loadCardsFromRows(rows, sig = 'custom') {
            if (rows.length === 0) return false;

            const newCards = rows.map((r, i) => ({
                id: i,
                word: r[0].trim(),
                parsed: parseCardText(r[1] ? r[1].trim() : "")
            }));

            appState = { ...emptyState(), cards: newCards, totalImported: newCards.length, vocabSig: sig };
            appState.pending = shuffleArray(newCards.map(c => c.id));
            // 雲端同步開著的話，先試著把雲端進度接續回來，而不是整個蓋掉
            if (syncId) await loadFromCloud(syncId);
            sanitizeState();

            ui.mode = 'new';
            ui.side = 'front';
            ui.reviewId = null;
            updateState();
            return true;
        }

        function loadCardsFromText(text) {
            return loadCardsFromRows(parseCSV(text));
        }

        // 預設單字庫：優先讀已經解析好的 JSON（傳輸會被壓縮、解析也快很多），失敗再退回原始 CSV
        async function fetchDefaultRows() {
            try {
                const res = await fetch('toeic_vocabulary.json');
                if (res.ok) {
                    const rows = await res.json();
                    if (Array.isArray(rows) && rows.length) return rows;
                }
            } catch (e) {
                console.warn('JSON 單字庫載入失敗，改用 CSV', e);
            }
            const res = await fetch('toeic_vocabulary.csv');
            if (!res.ok) throw new Error('CSV ' + res.status);
            return parseCSV(await res.text());
        }

        /* === Views === */
        const viewCard = $('view-card');
        const viewOk = $('view-ok');
        const viewMessage = $('view-message');
        const elFront = $('card-front');
        const elBack = $('card-back');
        const frontGroup = $('front-word-group');
        const okListEl = $('ok-list');
        const btnStatOk = $('stat-ok-btn');
        const btnStatNo = $('stat-no-btn');

        function currentCardId() {
            if (ui.mode === 'new') return appState.pending.length ? appState.pending[0] : null;
            if (ui.mode === 'no') return appState.noIds.length ? appState.noIds[0] : null;
            return ui.reviewId;
        }

        function setView(name) {
            ui.view = name;
            viewCard.classList.toggle('active', name === 'card');
            viewOk.classList.toggle('active', name === 'ok');
            viewMessage.classList.toggle('active', name === 'message');

            $('view-course').classList.toggle('active', name === 'course');

            renderHeader();
            positionDeco();
            // 背景跟著區域換：單字＝森林、地圖＝黃昏城堡、章節＝各自的主題
            setSceneTheme(['card', 'ok', 'message'].includes(name) ? 'forest' : name === 'course' ? (SCENE_OF[ui.sceneCh] || 'dusk') : 'dusk');
        }

        function renderHeader() {
            $('stat-ok').textContent = appState.okIds.length;
            $('stat-no').textContent = appState.noIds.length;
            btnStatOk.classList.toggle('active', ui.view === 'ok' || (ui.view === 'card' && ui.mode === 'ok'));
            btnStatNo.classList.toggle('active', ui.view === 'card' && ui.mode === 'no');
            const showBack = ui.view !== 'map';
            $('btn-back').classList.toggle('hidden', !showBack);
            document.querySelector('header').classList.toggle('has-back', showBack);

        function renderBottomBar() {
            const bar = $('bottom-bar'), label = $('mode-label');
            if (ui.view === 'message' || ui.view === 'course' || ui.loading) { bar.classList.add('hidden'); return; }
            bar.classList.remove('hidden');
            if (ui.view === 'map') {
                const into = course.xp % XP_PER_LV;
                $('xp-bar').classList.remove('hidden');
                $('xp-fill').style.width = (into / XP_PER_LV * 100).toFixed(1) + '%';
                label.textContent = `Lv ${level()} · 下一級還差 ${XP_PER_LV - into} XP`;
                return;
            }
            // 經驗值條只在背新單字時顯示
            const total = appState.totalImported, done = total - appState.pending.length;
            const showXp = ui.view === 'card' && ui.mode === 'new' && total > 0;
            $('xp-bar').classList.toggle('hidden', !showXp);
            if (showXp) $('xp-fill').style.width = (done / total * 100).toFixed(1) + '%';
            if (ui.view === 'ok') label.textContent = `OK 單字 · ${appState.okIds.length}`;
            else if (ui.mode === 'no') label.textContent = `NO 複習 · 剩 ${appState.noIds.length} 個`;
            else if (ui.mode === 'ok') label.textContent = 'OK 單字複習';
            else label.textContent = `新單字 · ${appState.totalImported - appState.pending.length} / ${appState.totalImported}`;
        }

        /* === 背景主視覺：每個區域／章節各有一個像素場景（橫向捲動、無限循環） === */
        // 先在很小的 canvas 上一格一格畫，再由 CSS 放大成整個畫面。
        // 天空（含太陽、月亮、星星、地面）是不動的底圖；其餘五層各畫在一張「頭尾相接」的長條圖上
        // （寬度 TW），用不同速度往左移，越近越快（視差），看起來像鏡頭一直往右走。
        // 規則：亂數用固定種子；跨過長條圖邊界的物件用 wrap() 在兩邊各畫一次；
        // 地形用整數個週期（per()），頭尾才接得起來。
        // 主題：地圖＝黃昏城堡、單字＝魔法森林、Part 5 文法＝白天小鎮、Part 5 詞彙＝魔法圖書塔、
        // Part 6＝海港、Part 7＝沙漠遺跡、聽力＝水晶洞窟、魔王關＝火山。
        const SCENE_OF = { vocab: 'forest', p5g: 'meadow', p5v: 'library', p6: 'harbor', p7s: 'desert', p7m: 'desert', p7t: 'desert', p2: 'cave', p34: 'cave', boss: 'volcano' };
        const scene = { theme: 'dusk', layers: [], sky: null, W: 0, TW: 0, t0: performance.now(), last: '', running: false,
            still: window.matchMedia('(prefers-reduced-motion: reduce)').matches };

        function sceneKit(theme) {
            const S = window.innerWidth < 600 ? 3 : 4;                 // 一格像素＝畫面上幾 px
            const W = Math.ceil(window.innerWidth / S), H = Math.ceil(window.innerHeight / S);
            const TW = Math.max(Math.round(W * 1.6), 420);             // 一輪循環的寬度
            let seed = 20261117;
            for (const ch of theme) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
            const rnd = () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296;
            const K = {
                W, H, TW, rnd,
                hz: Math.round(H * 0.70),                                // 地平線
                k: Math.max(1, Math.round(H / 150)),                     // 建築物的放大倍數
                u: x => x / TW,
                tri: t => 1 - Math.abs(((t % 1) + 1) % 1 * 2 - 1),      // 三角波：尖尖的山
                sn: (x, n, ph = 0) => Math.sin((x / TW * n + ph) * Math.PI * 2),   // 一輪 n 個週期的正弦波
                per: d => Math.max(1, Math.round(TW / d)),               // 每 d 格一個週期，取整數
                pick: a => a[Math.floor(rnd() * a.length)],
                // 開一張新的圖層，回傳 [canvas, 畫方塊的函式]
                layer: w => {
                    const cv = document.createElement('canvas'); cv.width = w; cv.height = H;
                    const ctx = cv.getContext('2d');
                    return [cv, (x, y, pw, ph, c) => { ctx.fillStyle = c; ctx.fillRect(Math.round(x), Math.round(y), Math.max(1, Math.round(pw)), Math.max(1, Math.round(ph))); }];
                },
                // 跨過圖層左右邊界的東西要在兩邊各畫一次，接縫才不會斷
                wrap: fn => [-TW, 0, TW].forEach(fn),
                // 由上到下的色帶，交界用棋盤格抖色
                gradient(px, cols, y0, y1) {
                    const band = (y1 - y0) / cols.length;
                    cols.forEach((c, i) => {
                        const a = Math.round(y0 + i * band), b = Math.round(y0 + (i + 1) * band);
                        px(0, a, W, b - a, c);
                        if (i > 0) for (let x = 0; x < W; x++) {
                            if (x % 2 === 0) px(x, a, 1, 1, cols[i - 1]);
                            if (x % 4 === 1) px(x, a + 2, 1, 1, cols[i - 1]);
                        }
                    });
                },
                stars(px, n, y0, y1, cols) {
                    for (let i = 0; i < n; i++) {
                        const x = Math.floor(rnd() * W), y = Math.floor(y0 + rnd() * (y1 - y0)), t = rnd(), c = cols[Math.floor(t * cols.length)];
                        px(x, y, 1, 1, c);
                        if (t > 0.94) { px(x - 1, y, 3, 1, c); px(x, y - 1, 1, 3, c); }
                    }
                },
                // 圓盤（月亮、太陽）；shade＝右下的陰影，glow＝外圈光暈，cut＝挖掉一個圓變成弦月
                disc(px, cx, cy, R, c, shade, glow, cut) {
                    for (let dy = -R - 5; dy <= R + 5; dy++) for (let dx = -R - 5; dx <= R + 5; dx++) {
                        const d2 = dx * dx + dy * dy;
                        if (d2 <= R * R) {
                            if (cut && (dx - cut[0]) ** 2 + (dy - cut[1]) ** 2 <= R * R) continue;
                            const sh = shade && (dx + R * 0.35) ** 2 + (dy + R * 0.3) ** 2 > R * R * 0.95;
                            px(cx + dx, cy + dy, 1, 1, sh ? shade : c);
                        } else if (glow && d2 <= (R + 5) * (R + 5) && (dx + dy) % 2 === 0 && (d2 <= (R + 2) * (R + 2) || (dx - dy) % 4 === 0)) {
                            px(cx + dx, cy + dy, 1, 1, glow);
                        }
                    }
                },
                // 山脊：top(x) 是每一欄的頂端；light＝向光的左坡，dark＝背光的右坡
                ridge(p, top, bottom, col, light, dark) {
                    for (let x = 0; x < TW; x++) {
                        const t = top(x);
                        if (bottom - t <= 0) continue;
                        p(x, t, 1, bottom - t, col);
                        if (light && (top(x - 1) > t || top(x - 2) > t)) p(x, t, 1, 2, light);
                        else if (dark && (top(x + 1) > t || top(x + 2) > t)) p(x, t, 1, 2, dark);
                    }
                },
                cloud(pc, x, y, w, dark, light) {
                    K.wrap(o => {
                        pc(o + x + w * 0.25, y - 4, w * 0.4, 2, light);
                        pc(o + x + w * 0.1, y - 2, w * 0.7, 2, light);
                        pc(o + x, y, w, 3, dark);
                        pc(o + x + w * 0.15, y + 3, w * 0.6, 1, dark);
                    });
                },
                pine(p, x, base, th, col) {
                    K.wrap(o => {
                        p(o + x, base - 2, 1, 2, col);
                        for (let j = 0; j < th; j++) {
                            const w = Math.max(1, 1 + Math.floor(j / 2) * 2 - (j % 4 === 3 ? 2 : 0));
                            p(o + x - Math.floor(w / 2), base - 2 - th + j, w, 1, col);
                        }
                    });
                },
                // 底座小丘（建築物用）
                mound(p, cx, by, top, body) {
                    const k = K.k;
                    for (let j = 0; j < 6; j++) p(cx - (17 + j * 4) * k, by + j * k, (34 + j * 8) * k, k, j === 0 ? top : body);
                },
                // 一般的五層速度：遠到近
                speeds: [1.5, 3, 6, 9, 15]
            };
            return K;
        }

        const SCENES = {
            /* --- 地圖：黃昏山谷裡的城堡 --- */
            dusk(K) {
                const { W, H, TW, hz, rnd, tri, u, k } = K;
                const [skyCv, px] = K.layer(W);
                K.gradient(px, ['#140b2e', '#1d1042', '#291658', '#38206f', '#4b2885', '#663092', '#8a3a96', '#b24a8f', '#d9627f', '#f58a6e', '#ffb86b'], 0, hz);
                K.stars(px, Math.round(W * H / 260), 0, hz * 0.62, ['#FFF1E8', '#FFF1E8', '#FFF1E8', '#c9b6ff', '#FFEC27']);
                const R = Math.max(9, Math.min(26, Math.round(Math.min(W, H) * 0.11)));
                const mx = Math.round(W * 0.80), my = Math.round(hz * 0.30);
                K.disc(px, mx, my, R, '#FFF1E8', '#e3c6d6', 'rgba(255, 241, 232, 0.22)');
                [[-0.35, -0.2, 0.18], [0.1, 0.25, 0.13], [-0.1, 0.5, 0.09], [0.35, -0.35, 0.1]].forEach(([ox, oy, cr]) => {
                    const r = Math.max(1, Math.round(R * cr));                     // 坑洞
                    px(mx + ox * R - r, my + oy * R - r + 1, r * 2, r * 2 - 2, '#d2b3cb');
                    px(mx + ox * R - r + 1, my + oy * R - r, r * 2 - 2, r * 2, '#d2b3cb');
                });
                px(0, hz, W, H - hz, '#28124a');

                const [cloudCv, pc] = K.layer(TW);
                K.cloud(pc, TW * 0.04, hz * 0.22, 34, '#5b2f8d', '#7d45a6');
                K.cloud(pc, TW * 0.36, hz * 0.14, 26, '#4a2680', '#6a3a99');
                K.cloud(pc, TW * 0.70, hz * 0.26, 30, '#5b2f8d', '#7d45a6');
