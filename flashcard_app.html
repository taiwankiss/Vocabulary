                // 地標：魔王城
                const [fortCv, pk] = K.layer(TW);
                const cx = Math.round(TW * 0.34), by = hz - 2 * k;
                K.mound(pk, cx, by, '#3a0c08', '#160404');
                const c = (x, y, w, h, col) => pk(cx + x * k, by + y * k, w * k, h * k, col);
                const dk = '#0c0202';
                c(-12, -18, 24, 18, dk); c(-18, -28, 7, 28, dk); c(11, -28, 7, 28, dk); c(-4, -36, 8, 18, dk);
                [[-18, -28, 7], [11, -28, 7], [-4, -36, 8]].forEach(([x, y, w]) => { for (let j = 0; j < 6; j++) c(x + j * 0.5, y - j, w - j, 1, dk); c(x + w / 2 - 0.5, y - 9, 1, 3, dk); });
                for (let i = 0; i < 24; i += 3) c(-12 + i, -20, 2, 2, dk);
                c(-15, -22, 1, 2, '#ff2a2a'); c(14, -22, 1, 2, '#ff2a2a'); c(-2, -30, 1, 2, '#ff2a2a'); c(1, -30, 1, 2, '#ff2a2a'); c(-8, -12, 1, 2, '#ff8a1a'); c(7, -12, 1, 2, '#ff8a1a');
                c(-4, -9, 8, 9, '#ff5a12'); c(-3, -10, 6, 1, '#ff5a12'); c(-3, -8, 6, 8, '#ffb01a'); c(-1, -9, 2, 9, dk);
                c(-15, -40, 1, 12, dk); c(-14, -40, 5, 3, '#a01818'); c(14, -40, 1, 12, dk); c(15, -40, 5, 3, '#a01818');
                // 前景：岩漿河
                const [lavaCv, pl] = K.layer(TW);
                const h1 = K.per(180), h2 = K.per(50), lp = K.per(120);
                const top = x => Math.round(H * 0.85 - K.sn(x, h1) * H * 0.03 - K.sn(x, h2, 0.6) * H * 0.012);
                for (let x = 0; x < TW; x++) {
                    const t = top(x), pool = K.sn(x, lp);
                    pl(x, t, 1, H - t, '#0e0303'); pl(x, t, 1, 1, '#4a1008');
                    if (pool > 0.55) {
                        const d = Math.round((pool - 0.55) * 14);
                        pl(x, t + 4, 1, d + 1, '#ff5a12'); if (pool > 0.7) pl(x, t + 4, 1, Math.max(1, d - 2), '#ffb01a');
                        if (x % 4 === 0) pl(x, t + 3, 1, 1, 'rgba(255, 160, 40, 0.5)');
                    }
                }
                for (let i = 0, n = Math.round(TW / 24); i < n; i++) {
                    const x = Math.floor(rnd() * TW), h = 5 + Math.floor(rnd() * 9);
                    K.wrap(o => { for (let j = 0; j < h; j++) { const w = Math.max(1, Math.round(3 * j / h)); pl(o + x - Math.floor(w / 2), top(x) - h + j + 1, w, 1, '#070101'); } pl(o + x, top(x) - h + 2, 1, 1, '#ff4a12'); });
                }
                return { sky: skyCv, layers: [cloudCv, farCv, nearCv, fortCv, lavaCv] };
            }
        };

        function buildScene() {
            const K = sceneKit(scene.theme);
            const main = $('scene');
            main.width = K.W; main.height = K.H;
            const b = SCENES[scene.theme](K);
            // speed：每秒往左移幾格像素（越後面的圖層越近、越快）
            scene.sky = b.sky; scene.W = K.W; scene.TW = K.TW; scene.last = '';
            scene.layers = b.layers.map((cv, i) => ({ cv, speed: K.speeds[i] }));
        }
        // 換場景：只有主題真的不同才重畫
        function setSceneTheme(name) {
            if (!SCENES[name]) name = 'dusk';
            if (name === scene.theme && scene.sky) return;
            scene.theme = name;
            startScene();
        }

        // 每一幀：算出各層移到哪一格；有任何一層移了整格才重畫（所以捲動是一格一格跳的）
        function paintScene(now) {
            const { W, TW, layers } = scene;
            const t = scene.still ? 0 : (now - scene.t0) / 1000;
            const offs = layers.map(l => Math.floor(t * l.speed) % TW);
            const key = offs.join();
            // 視窗大小是 0 時（例如頁面在背景載入）先不畫，等 resize 重建；迴圈不能因此中斷
            if (key !== scene.last && scene.sky.width && scene.sky.height) {
                scene.last = key;
                const ctx = $('scene').getContext('2d');
                ctx.drawImage(scene.sky, 0, 0);
                layers.forEach((l, i) => { for (let x = -offs[i]; x < W; x += TW) ctx.drawImage(l.cv, x, 0); });
            }
            if (scene.still) scene.running = false;
            else requestAnimationFrame(paintScene);
        }
        function startScene() {
            buildScene();
            if (scene.still) paintScene(performance.now());
            else if (!scene.running) { scene.running = true; requestAnimationFrame(paintScene); }
        }
        startScene();
        let sceneTimer = 0;
        window.addEventListener('resize', () => { clearTimeout(sceneTimer); sceneTimer = setTimeout(startScene, 120); });

        /* === 背景粒子 === */
        (function makeParticles() {
            const host = $('particles');
            const cols = ['#FFF1E8', '#29ADFF', '#FFEC27', '#FF77A8', '#C2C3C7'];
            const n = window.innerWidth < 600 ? 34 : 60;
            for (let i = 0; i < n; i++) {
                const el = document.createElement('span');
                const size = [2, 2, 2, 3, 4][Math.floor(Math.random() * 5)];
                const c = cols[Math.floor(Math.random() * cols.length)];
                el.style.cssText = `left:${(Math.random() * 100).toFixed(1)}%;width:${size}px;height:${size}px;background:${c};` +
                    `opacity:${(0.35 + Math.random() * 0.6).toFixed(2)};` +
                    `--dx:${Math.round(Math.random() * 80 - 40)}px;animation-duration:${(9 + Math.random() * 10).toFixed(1)}s;` +
                    `animation-delay:-${(Math.random() * 19).toFixed(1)}s;`;
                host.appendChild(el);
            }
        })();

        /* === 兩側裝飾單字：轉 90 度、裁掉一半、只有外圈輪廓 === */
        // 用 canvas 先描邊、再把文字本體挖掉，只留下字外緣的一圈線——
        // 效果等同 Illustrator 的「文字轉外框 + 聯集」，不會出現筆畫重疊處的內部線條。
        const decoLeft = $('deco-left');
        const decoRight = $('deco-right');
        const DECO_FONT = "'Press Start 2P', monospace";
        const DECO_LINE = 2; // 外框線粗細（px）

        function pickWord(id) { const c = appState.cards[id]; return c ? c.word : ''; }
        function randomWord() {
            const n = appState.cards.length;
            return n ? appState.cards[Math.floor(Math.random() * n)].word : '';
        }

        // 裝飾字以目前主畫面（卡片 / 列表 / 訊息）的垂直中心為準，上下居中
        function decoCenterY() {
            const panel = ui.view === 'ok' ? viewOk : ui.view === 'message' ? viewMessage : $('card-container');
            const r = panel.getBoundingClientRect();
            return r.height ? r.top + r.height / 2 : window.innerHeight / 2;
        }

        function positionDeco() {
            const y = decoCenterY() + 'px';
            decoLeft.style.top = y;
            decoRight.style.top = y;
        }

        const decoMeasureCtx = document.createElement('canvas').getContext('2d');

        // 這個字在畫面上的大小與字形範圍：外框裝飾與背景點點的挖空共用，兩邊才會完全對齊
        function decoLayout(text) {
            const cy = decoCenterY();
            const maxLen = Math.min(cy, window.innerHeight - cy) * 2 * 0.96;
            const measure = size => { decoMeasureCtx.font = `400 ${size}px ${DECO_FONT}`; return decoMeasureCtx.measureText(text); };

            // 字太長就縮小，確保整個字都在畫面上下範圍內
            let size = Math.min(Math.max(window.innerWidth * 0.15, 120), 240);
            let m = measure(size);
            let inkW = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
            if (inkW > maxLen) {
                size = Math.max(40, size * maxLen / inkW);
                m = measure(size);
                inkW = m.actualBoundingBoxLeft + m.actualBoundingBoxRight;
            }
            return { size, m, inkW, inkH: m.actualBoundingBoxAscent + m.actualBoundingBoxDescent };
        }

        function drawDeco(canvas, text) {
            canvas.dataset.text = text;
            if (!text) { canvas.style.display = 'none'; return; }
            canvas.style.display = '';

            const ctx = canvas.getContext('2d');
            const dpr = Math.min(window.devicePixelRatio || 1, 2);
            const { size, m, inkW, inkH } = decoLayout(text);
            const pad = Math.ceil(DECO_LINE) + 2;
            const wCss = Math.ceil(inkW) + pad * 2;
            const hCss = Math.ceil(inkH) + pad * 2;

            // 畫布剛好包住字的實際範圍，所以旋轉後的「裁一半」就是切在字的正中間
            canvas.width = Math.round(wCss * dpr);
            canvas.height = Math.round(hCss * dpr);
            canvas.style.width = wCss + 'px';
            canvas.style.height = hCss + 'px';
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            ctx.font = `400 ${size}px ${DECO_FONT}`;
            ctx.textBaseline = 'alphabetic';
            const x = pad + m.actualBoundingBoxLeft;
            const y = pad + m.actualBoundingBoxAscent;
            const rgb = getComputedStyle(document.documentElement).getPropertyValue('--deco-rgb').trim();
            ctx.lineJoin = 'miter';
            ctx.lineWidth = DECO_LINE * 2; // 描邊的外側一半才是最後留下的線
            ctx.strokeStyle = `rgb(${rgb})`;
            ctx.strokeText(text, x, y);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.fillText(text, x, y); // 挖掉文字本體（連同內部重疊的線）
            ctx.globalCompositeOperation = 'source-over';
        }

        function setDeco(canvas, text) {
            if (canvas.dataset.text === text) return;
            drawDeco(canvas, text);
            canvas.classList.remove('deco-in');
            void canvas.offsetWidth;
            canvas.classList.add('deco-in');
        }

        function redrawDeco() {
            drawDeco(decoLeft, decoLeft.dataset.text || '');
            drawDeco(decoRight, decoRight.dataset.text || '');
        }

        // 左右都是「現在這個單字」；不在卡片畫面時沿用最後一次的單字
        function updateDeco() {
            let word = '';
            if (ui.view === 'card') {
                const id = currentCardId();
                if (id != null) word = pickWord(id);
            }
            if (word) ui.decoWord = word;
            else if (!ui.decoWord) ui.decoWord = randomWord();
            setDeco(decoLeft, ui.decoWord);
            setDeco(decoRight, ui.decoWord);
        }

        /* === 卡片 === */
        // 單字太長時自動縮小，確保一行放得下
        function fitFrontWord() {
            frontGroup.style.fontSize = '';
            if (elFront.clientWidth) {
                let size = parseFloat(getComputedStyle(frontGroup).fontSize);
                let guard = 0;
                while (frontGroup.offsetWidth > elFront.clientWidth && size > 18 && guard++ < 60) {
                    size -= 2;
                    frontGroup.style.fontSize = size + 'px';
                }
            }
            alignSpeaker();
        }

        // 讓單字對齊「實際字形範圍」的上下中心，而不是行框（含上下留白）的中心
        const frontWordEl = $('front-word');
        const measureCtx = document.createElement('canvas').getContext('2d');

        function alignSpeaker() {
            let dy = 0;
            const text = frontWordEl.textContent;
            const lineBox = frontWordEl.offsetHeight;
            const cs = getComputedStyle(frontWordEl);
            const lh = parseFloat(cs.lineHeight);
            if (text && lineBox && lh > 0 && lineBox <= lh * 1.5) { // 換行的片語就不調整
                measureCtx.font = `${cs.fontWeight} ${cs.fontSize} ${cs.fontFamily}`;
                const m = measureCtx.measureText(text);
                if (m.fontBoundingBoxAscent !== undefined) {
                    const baseline = (lh - (m.fontBoundingBoxAscent + m.fontBoundingBoxDescent)) / 2 + m.fontBoundingBoxAscent;
                    const inkCenter = baseline + (m.actualBoundingBoxDescent - m.actualBoundingBoxAscent) / 2;
                    dy = inkCenter - lh / 2;
                }
            }
            // 讓單字字形的上下中心落在圓圈圓心
            frontGroup.style.setProperty('--dy', dy.toFixed(1) + 'px');
        }

        function setFrontWord(word) {
            const esc = ch => ch.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
            let i = 0;
            frontWordEl.innerHTML = word.split(' ').map(w =>
                '<span class="w">' + [...w].map(ch => `<span class="l" style="--i:${i++}">${esc(ch)}</span>`).join('') + '</span>'
            ).join(' ');
        }

        function renderCard() {
            const id = currentCardId();
            if (id == null) return;
            const card = appState.cards[id];
            if (!card) return;

            if (ui.side === 'front') {
                elFront.classList.remove('flipped');
                elBack.classList.remove('flipped');
                setFrontWord(card.word);
                fitFrontWord();
                updateDeco();
                playAudio(card.word);
            } else {
                elFront.classList.add('flipped');
                elBack.classList.add('flipped');

                $('back-translation').innerHTML = card.parsed.translation;

                const elForms = $('back-forms');
                if (card.parsed.wordForms) { elForms.innerHTML = card.parsed.wordForms; elForms.classList.remove('hidden'); }
                else elForms.classList.add('hidden');

                const elColloc = $('back-collocations');
                if (card.parsed.collocations) { elColloc.innerHTML = card.parsed.collocations; elColloc.classList.remove('hidden'); }
                else elColloc.classList.add('hidden');

                const elExBox = $('back-example-box');
                if (card.parsed.example) {
                    $('back-example-text').innerHTML = card.parsed.example;
                    elExBox.classList.remove('hidden');
                    playAudio(card.parsed.exampleEng);
                } else {
                    elExBox.classList.add('hidden');
                }
            }
        }

        function flipCard() {
            if (ui.view !== 'card' || currentCardId() == null) return;
            ui.side = 'back';
            renderCard();
        }

        function showCardView() {
            ui.loading = false;
            elFront.classList.remove('loading');
            setView('card');
            renderCard();
        }

        /* === 模式切換 === */
        function enterNewMode() {
            ui.mode = 'new';
            ui.side = 'front';
            ui.reviewId = null;
            if (appState.cards.length === 0) { showEmptyScreen(); return; }
            if (appState.pending.length === 0) { showEndScreen(); return; }
            showCardView();
        }

        function enterNoMode() {
            if (appState.noIds.length === 0) {
                showDialog('👍', '沒有單字需要複習', 'NO 單字庫目前是空的。');
                return;
            }
            ui.mode = 'no';
            ui.side = 'front';
            ui.reviewId = null;
            showCardView();
        }

        function openOkCard(id) {
            ui.okScroll = okListEl.scrollTop;
            ui.mode = 'ok';
            ui.reviewId = id;
            ui.side = 'front';
            showCardView();
        }

        /* === OK 單字列表（膠囊）：一次只畫一部分，捲到底再補 === */
        const OK_CHUNK = 240;
        let okOrder = [];
        let okRendered = 0;

        function updateOkEmpty() {
            $('ok-empty').classList.toggle('hidden', okOrder.length > 0);
            okListEl.classList.toggle('hidden', okOrder.length === 0);
        }

        function appendOkChunk() {
            const frag = document.createDocumentFragment();
            const end = Math.min(okOrder.length, okRendered + OK_CHUNK);
            for (let i = okRendered; i < end; i++) {
                const id = okOrder[i];
                const card = appState.cards[id];
                if (!card) continue;
                const n = appState.noCount[id] || 0;
                const btn = document.createElement('button');
                btn.className = 'capsule ' + (n === 0 ? 'cap-green' : n === 1 ? 'cap-yellow' : 'cap-red');
                btn.textContent = card.word;
                btn.dataset.id = id;
                frag.appendChild(btn);
            }
            okRendered = end;
            okListEl.appendChild(frag);
        }

        function renderOkList() {
            okListEl.innerHTML = '';
            okOrder = [...appState.okIds].reverse(); // 最近背完的在最前面
            okRendered = 0;
            updateOkEmpty();
            appendOkChunk();
            okListEl.scrollTop = 0;
        }

        function openOkList() {
            if (appState.cards.length === 0) return;
            setView('ok');
            renderOkList();
            updateDeco();
        }

        // 從單張複習回到列表：保留捲動位置；如果那個字被按了 NO 就從列表拿掉
        function returnToOkList(removedId) {
            setView('ok');
            if (removedId != null) {
                const el = okListEl.querySelector(`[data-id="${removedId}"]`);
                if (el) { el.remove(); okRendered--; }
                const i = okOrder.indexOf(removedId);
                if (i !== -1) okOrder.splice(i, 1);
                updateOkEmpty();
            }
            okListEl.scrollTop = ui.okScroll || 0;
            updateDeco();
        }

        okListEl.addEventListener('scroll', () => {
            if (okRendered < okOrder.length && okListEl.scrollTop + okListEl.clientHeight >= okListEl.scrollHeight - 200) {
                appendOkChunk();
            }
        });
        okListEl.addEventListener('click', (e) => {
            const btn = e.target.closest('.capsule');
            if (btn) openOkCard(Number(btn.dataset.id));
        });

        /* === 對話框（需要按「確認」才會關閉） === */
        let dialogAction = null;
        function showDialog(icon, title, message, onConfirm) {
            $('dialog-icon').textContent = icon;
            $('dialog-title').textContent = title;
            $('dialog-msg').textContent = message;
            dialogAction = onConfirm || null;
            ui.dialog = true;
            $('dialog').classList.remove('hidden');
            $('dialog-ok').focus();
        }
        function closeDialog() {
            if (!ui.dialog) return;
            ui.dialog = false;
            $('dialog').classList.add('hidden');
            const fn = dialogAction;
            dialogAction = null;
            if (fn) fn();
        }
        $('dialog-ok').addEventListener('click', closeDialog);

        /* === OK / NO 判定 === */
        function judge(result) {
            const id = currentCardId();
            if (id == null || ui.view !== 'card') return;
            const mode = ui.mode;
            const { pending, noIds, okIds, noCount } = appState;
            const removeFrom = (arr, v) => { const i = arr.indexOf(v); if (i !== -1) arr.splice(i, 1); };

            if (result === 'ok') {
                if (mode === 'new') { pending.shift(); okIds.push(id); }
                else if (mode === 'no') { removeFrom(noIds, id); okIds.push(id); }
                // mode === 'ok'：本來就在 OK 列表，維持原樣
            } else {
                noCount[id] = (noCount[id] || 0) + 1;
                if (mode === 'new') { pending.shift(); noIds.push(id); }
                else if (mode === 'no') { noIds.shift(); noIds.push(id); }
                else { removeFrom(okIds, id); noIds.push(id); }
            }

            ui.side = 'front';
            updateState();

            if (mode === 'ok') {
                returnToOkList(result === 'no' ? id : null);
            } else if (mode === 'no') {
                if (noIds.length === 0) {
                    renderHeader();
                    showDialog('🎉', '複習完成', 'NO 單字庫已經全部複習完了！', enterNewMode);
                } else {
                    showCardView();
                }
            } else {
                enterNewMode();
            }
        }

        function showLoadingScreen() {
            ui.loading = true;
            elFront.classList.add('loading');
            setView('card');
        }

        function showEndScreen() {
            setView('message');
            const ok = appState.okIds.length, no = appState.noIds.length;
            $('msg-title').textContent = '新單字都看完了！';
            $('msg-desc').textContent = no > 0 ? `還有 ${no} 個 NO 單字可以複習` : '全部單字都 OK 了 🎉';

            $('msg-stats').classList.remove('hidden');
            $('end-stat-ok').innerHTML = `${ok}<span>OK</span>`;
            $('end-stat-no').innerHTML = `${no}<span>NO</span>`;

            const btnReview = $('btn-review-no');
            btnReview.classList.toggle('hidden', no === 0);
            btnReview.textContent = `複習 NO 單字（${no}）`;

            const btnRestart = $('btn-restart');
            btnRestart.classList.remove('hidden');
            btnRestart.classList.toggle('btn-primary', no === 0);
            btnRestart.classList.toggle('btn-outline', no > 0);
            updateDeco();
        }

        function showEmptyScreen() {
            ui.loading = false;
            setView('message');
            $('msg-title').textContent = '準備開始學習！';
            $('msg-desc').textContent = '找不到內建單字庫，請確認網路連線，或手動匯入 CSV 檔案';
            $('msg-stats').classList.add('hidden');
            $('btn-review-no').classList.add('hidden');
            $('btn-restart').classList.add('hidden');
            updateDeco();
        }

        function restartQueue() {
            if (!confirm('確定要重新開始嗎？所有 OK / NO 紀錄都會清空。')) return;
            appState.pending = shuffleArray(appState.cards.map(c => c.id));
            appState.noIds = [];
            appState.okIds = [];
            appState.noCount = {};
            updateState();
            enterNewMode();
        }

        /* === Audio === */
        // 從裝置內建的英文語音挑最自然的一個：神經網路／增強版語音優先，排除機器人、怪聲那類
        const NOVELTY = /Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Rocko|Shelley|Sandy|Eddy|Flo|Reed/i;
        const VOICE_RANK = [/Natural|Neural|Online/i, /Premium/i, /Enhanced|Siri/i, /Google US English/i, /^(Ava|Zoe|Evan|Nathan|Allison|Samantha|Susan|Tom)\b/i, /Google UK English/i, /Daniel|Karen|Moira|Serena|Alex/i];
        let bestVoice = null;
        function pickVoice() {
            if (!window.speechSynthesis) return null;
            const vs = speechSynthesis.getVoices().filter(v => /^en[-_](US|GB|AU|CA)/i.test(v.lang) && !NOVELTY.test(v.name));
            if (!vs.length) return null;
            const score = v => { const i = VOICE_RANK.findIndex(r => r.test(v.name)); return (i === -1 ? 99 : i) * 2 + (/en[-_]US/i.test(v.lang) ? 0 : 1); };
            bestVoice = vs.slice().sort((a, b) => score(a) - score(b))[0];
            return bestVoice;
        }
        if (window.speechSynthesis) { pickVoice(); speechSynthesis.addEventListener('voiceschanged', pickVoice); }
        function makeUtterance(text) {
            const u = new SpeechSynthesisUtterance(text);
            const v = bestVoice || pickVoice();
            if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
            u.rate = 0.92;
            return u;
        }
        // Part 3/4 不同說話者用不同聲音：W/W2 女聲、M/M2 男聲；找不到第二個聲音就用音高區分
        const FEMALE = /Samantha|Martha|Ava|Zoe|Allison|Susan|Karen|Moira|Serena|Tessa|Victoria|Fiona|Kate|Catherine|Nicky|Joelle|Libby|Sonia|Jenny|Aria|Emma|Michelle|Natasha|Clara|Female|Google US English$/i;
        const MALE = /Alex\b|Daniel|Tom\b|Evan|Nathan|Aaron|Arthur|Oliver|Gordon|Lee\b|Rishi|Guy|Ryan|William|Christopher|Eric|Brian|Male/i;
        function speakerVoice(sp) {
            const fem = /^W/.test(sp), second = /2$/.test(sp);
            const base = { pitch: fem ? 1.1 : 0.85 };
            if (!window.speechSynthesis) return base;
            const vs = speechSynthesis.getVoices().filter(v => /^en[-_](US|GB|AU|CA)/i.test(v.lang) && !NOVELTY.test(v.name));
            const score = v => { const i = VOICE_RANK.findIndex(r => r.test(v.name)); return (i === -1 ? 99 : i) * 2 + (/en[-_]US/i.test(v.lang) ? 0 : 1); };
            const pool = vs.filter(v => (fem ? FEMALE : MALE).test(v.name) && !(fem ? MALE : FEMALE).test(v.name)).sort((a, b) => score(a) - score(b));
            // 第二位同性別說話者：優先挑不同口音（美／英／澳）的聲音
            let v = pool[0];
            if (second && pool.length > 1) v = pool.find(x => x.lang.slice(3) !== pool[0].lang.slice(3)) || pool[1];
            if (!v) return { voice: bestVoice || pickVoice(), pitch: fem ? (second ? 1.3 : 1.12) : (second ? 0.95 : 0.78) };
            return { voice: v, pitch: second && v === pool[0] ? (fem ? 1.25 : 0.95) : 1 };
        }
        function playAudio(text) {
            if (!window.speechSynthesis || !text) return;
            window.speechSynthesis.cancel();

        /* ===================================================================
           多益課程：闖關地圖、章節（重點卡 → 練習 → 測驗）、弱點檢測、錯題本
           題目資料在 data/course.json；進度存在 IndexedDB 的 "course"，並跟著雲端同步碼一起同步
           =================================================================== */
        const XP_PER_LV = 300;
        let COURSE = null;                 // data/course.json
        let QINDEX = {};                   // 題目 id → 題目
        let course = emptyCourse();        // 學習進度
        let quiz = null;                   // 進行中的測驗
        let lessonIdx = 0;                 // 重點卡第幾張

        function emptyCourse() { return { v: 1, xp: 0, diag: null, ch: {}, wrong: [], updatedAt: 0 }; }
        function normalizeCourse(c) {
            const e = emptyCourse();
            if (!c || typeof c !== 'object') return e;
            return { ...e, ...c, ch: (c.ch && typeof c.ch === 'object') ? c.ch : {}, wrong: Array.isArray(c.wrong) ? c.wrong : [] };
        }
        const escHtml = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

        async function saveCourseLocal() {
            try {
                const dbx = await openDB();
                const tx = dbx.transaction(STORE_NAME, "readwrite");
                tx.objectStore(STORE_NAME).put(course, "course");
                await new Promise(r => tx.oncomplete = r);
            } catch (e) {
                try { localStorage.setItem('course_state', JSON.stringify(course)); } catch (e2) {}
            }
        }
        async function loadCourseLocal() {
            try {
                const dbx = await openDB();
                const req = dbx.transaction(STORE_NAME, "readonly").objectStore(STORE_NAME).get("course");
                return await new Promise(r => { req.onsuccess = () => r(req.result); req.onerror = () => r(null); });
            } catch (e) {
                try { return JSON.parse(localStorage.getItem('course_state')); } catch (e2) { return null; }
            }
        }
        // 雲端那份比較新才採用
        function mergeCloudCourse(json) {
            if (typeof json !== 'string') return;
            try {
                const c = normalizeCourse(JSON.parse(json));
                if ((c.updatedAt || 0) > (course.updatedAt || 0)) { course = c; saveCourseLocal(); }
            } catch (e) {}
        }
        function saveCourse() {
            course.updatedAt = Date.now();
            saveCourseLocal();
            if (syncId) saveToCloud();
        }

        async function loadCourseData() {
            if (COURSE) return COURSE;
            const res = await fetch('data/course.json');
            if (!res.ok) throw new Error('course ' + res.status);
            COURSE = await res.json();
            QINDEX = {};
            const add = q => { QINDEX[q.id] = q; };
            COURSE.diagnostic.questions.forEach(add);
            Object.values(COURSE.lessons).forEach(l => { l.practice.forEach(add); l.test.forEach(add); });
            return COURSE;
        }

        function level() { return Math.floor(course.xp / XP_PER_LV) + 1; }
        function addXp(n) { course.xp = Math.max(0, course.xp + n); }

        /* --- 弱點分析：各題型的正確率與平均秒數 → 排出建議的章節順序 --- */
        function weakTags() {
            if (!course.diag || !course.diag.byTag) return [];
            return Object.entries(course.diag.byTag)
                .map(([tag, s]) => ({ tag, acc: s.n ? s.c / s.n : 1, sec: s.n ? s.sec / s.n : 0, n: s.n }))
                .sort((a, b) => a.acc - b.acc || b.sec - a.sec);
        }
        function recommendedChapters() {
            const seen = new Set(), out = [];
            if (COURSE.santa) COURSE.santa.focus.forEach(ch => { if (!seen.has(ch)) { seen.add(ch); out.push(ch); } });
            weakTags().filter(t => t.acc < 0.85).forEach(t => {
                const ch = COURSE.tags[t.tag] && COURSE.tags[t.tag].chapter;
                if (ch && !seen.has(ch)) { seen.add(ch); out.push(ch); }
            });
            return out;
        }

        /* === 地圖 === */
        function showMap() {
            stopQuiz();
            setView('map');
            const host = $('map-list');
            if (!COURSE) {
                host.innerHTML = '<p class="c-text">正在載入課程…</p>';
                loadCourseData().then(showMap).catch(() => { host.innerHTML = '<p class="c-text">課程載入失敗，請確認網路連線後重新整理。</p>'; });
                return;
            }
            $('map-lv').textContent = `Lv ${level()} · ${course.xp} XP`;
            const rec = recommendedChapters();
            let n = 0, html = '';
            COURSE.regions.forEach(rg => {
                const chs = COURSE.chapters.filter(c => c.region === rg.id);
                if (!chs.length) return;
                html += `<div class="region"><div class="region-name">${escHtml(rg.name)}</div>`;
                chs.forEach(c => {
                    n++;
                    const st = course.ch[c.id] || {};
                    let cls = 'stage', tag = '';
                    if (c.kind === 'soon') { cls += ' is-soon'; tag = '即將推出'; }
                    else if (c.kind === 'diag') { tag = course.diag ? `${course.diag.score}/${course.diag.total}` : '先做這個'; if (!course.diag) cls += ' is-rec'; }
                    else if (c.kind === 'santa') { tag = `${COURSE.santa.predicted}`; }
                    else if (c.kind === 'vocab') { tag = `${appState.okIds.length}/${appState.cards.length || 0}`; }
                    else if (st.cleared) { cls += ' is-clear'; tag = '★'.repeat(st.stars || 1) + '☆'.repeat(3 - (st.stars || 1)); }
                    if (c.kind !== 'diag' && c.kind !== 'santa' && !st.cleared && rec.includes(c.id)) { cls += ' is-rec'; tag = c.kind === 'soon' ? '弱點・即將推出' : '建議優先'; }
                    html += `<button class="${cls}" data-ch="${c.id}"><span class="stage-no">${String(n).padStart(2, '0')}</span>` +
                        `<span class="stage-body"><span class="stage-title">${escHtml(c.title)}</span><span class="stage-sub">${escHtml(c.sub)}</span></span>` +
                        `<span class="stage-tag">${escHtml(tag)}</span></button>`;
                });
                html += '</div>';
            });
            const nw = course.wrong.filter(id => QINDEX[id]).length;
            html += `<div class="region"><div class="region-name">道具</div>` +
                `<button class="stage is-wrong${nw ? '' : ' is-lock'}" data-ch="wrong"><span class="stage-no">✕</span>` +
                `<span class="stage-body"><span class="stage-title">錯題本</span><span class="stage-sub">${nw ? '答錯的題目，答對就會移除' : '目前沒有錯題'}</span></span>` +
                `<span class="stage-tag">${nw} 題</span></button></div>`;
            host.innerHTML = html;
        }

            if (c.kind === 'diag') { showDiagIntro(); return; }

        /* === 課程畫面共用 === */
        function courseScreen(bodyHtml, footHtml = '') {

        function courseAction(go) {
            if (go === 'map') return showMap();
            if (go === 'chapter') { stopQuiz(); return showChapter(ui.chapter); }   // 題目中離開：停掉語音和倒數

        /* === 章節首頁 === */
        function showChapter(id) {
            ui.chapter = id; ui.sceneCh = id;
            const c = COURSE.chapters.find(x => x.id === id), L = COURSE.lessons[id], st = course.ch[id] || {};
            const pct = v => v == null ? '' : `最佳 ${Math.round(v * 100)}%`;
            courseScreen(
                `<div class="c-kicker">${escHtml(COURSE.regions.find(r => r.id === c.region).name)}</div>` +
                `<h2 class="c-title">${escHtml(c.title)}</h2>` +
                `<p class="c-text">${escHtml(c.sub)}。練習和測驗每題限時 ${L.limit} 秒，超時算答錯；測驗答對 ${Math.round(L.pass * 100)}% 以上過關。</p>` +
                `<div class="steps">` +
                (L.notes ? `<button class="step-btn" data-go="notes"><span class="s-ico">📘</span><span class="s-main">講義<span class="s-sub">${L.notes.length} 節完整說明・表格與例句</span></span><span class="s-state">${st.notes ? '已讀' : ''}</span></button>` : '') +
                `<button class="step-btn" data-go="lesson"><span class="s-ico">📖</span><span class="s-main">重點卡<span class="s-sub">${L.cards.length} 張快速複習</span></span><span class="s-state">${st.lesson ? '已讀' : ''}</span></button>` +
                `<button class="step-btn" data-go="practice"><span class="s-ico">✏️</span><span class="s-main">練習<span class="s-sub">${L.practice.length} 題・答完馬上看解析</span></span><span class="s-state">${pct(st.practice)}</span></button>` +
                `<button class="step-btn" data-go="test"><span class="s-ico">⚔️</span><span class="s-main">章節測驗<span class="s-sub">${L.test.length} 題・${Math.round(L.pass * 100)}% 過關</span></span><span class="s-state">${st.cleared ? '★'.repeat(st.stars || 1) : pct(st.test)}</span></button>` +
                `</div>`,
                `<button class="btn-outline" data-go="map">‹ 地圖</button>`
            );
        }

        /* === 講義：完整說明，分節、表格、例句（可發音） === */
        function notesTable(tb) {
            if (!tb) return '';
            return `<div class="n-wrap"><table class="n-table"><tr>${tb.head.map(h => `<th>${escHtml(h)}</th>`).join('')}</tr>` +
                tb.rows.map(r => `<tr>${r.map(c => `<td>${escHtml(c)}</td>`).join('')}</tr>`).join('') + `</table></div>`;
        }
        function showNotes() {
            const c = COURSE.chapters.find(x => x.id === ui.chapter), N = COURSE.lessons[ui.chapter].notes;
            const num = i => String(i + 1).padStart(2, '0');
            const sayText = s => s.replace(/\s*\(.*$/, '').replace(/_{3,}/g, 'blank');   // 念英文題幹，括號裡的選項不念
            const body =
                `<div class="c-kicker">講義・${escHtml(c.title)}</div><h2 class="c-title">${escHtml(c.title)} 講義</h2>` +
                `<nav class="n-toc">${N.map((s, i) => `<a data-sec="${i}"><span>${num(i)}</span>${escHtml(s.h)}</a>`).join('')}</nav>` +
                N.map((s, i) =>
                    `<section class="n-sec" id="n-sec-${i}"><h3><span>${num(i)}</span>${escHtml(s.h)}</h3>` +
                    (s.p || []).map(t => `<p>${escHtml(t)}</p>`).join('') +
                    notesTable(s.table) +
                    (s.p2 || []).map(t => `<p>${escHtml(t)}</p>`).join('') +
                    notesTable(s.table2) +
                    (s.steps ? `<ol class="n-steps">${s.steps.map(t => `<li>${escHtml(t)}</li>`).join('')}</ol>` : '') +
                    (s.ex || []).map(([en, zh]) => `<div class="n-ex"><button class="say" data-say="${escHtml(sayText(en))}" aria-label="朗讀">🔊</button><div><div class="en">${escHtml(en)}</div><div class="zh">${escHtml(zh)}</div></div></div>`).join('') +
                    (s.tip ? `<div class="n-tip"><b>提醒</b>${escHtml(s.tip)}</div>` : '') +
                    `</section>`).join('');
            courseScreen(body, `<button class="btn-outline" data-go="chapter">‹ 章節</button><button class="btn-primary" data-go="notes-done">讀完了，看重點卡 ▶</button>`);
        }
        function finishNotes() {
            const st = course.ch[ui.chapter] = course.ch[ui.chapter] || {};
            if (!st.notes) { st.notes = true; addXp(30); saveCourse(); }
            showLesson(0);
        }

        /* === 重點卡 === */
        function showLesson(i) {
            const L = COURSE.lessons[ui.chapter];
            lessonIdx = Math.max(0, Math.min(L.cards.length - 1, i));
            const card = L.cards[lessonIdx], last = lessonIdx === L.cards.length - 1;
            if (last) { const st = course.ch[ui.chapter] = course.ch[ui.chapter] || {}; if (!st.lesson) { st.lesson = true; addXp(20); saveCourse(); } }
            courseScreen(
                `<div class="c-dots">${L.cards.map((_, k) => `<i class="${k <= lessonIdx ? 'on' : ''}"></i>`).join('')}</div>` +
                `<div class="c-kicker">重點卡 ${lessonIdx + 1} / ${L.cards.length}</div>` +
                `<h2 class="c-title">${escHtml(card.title)}</h2>` +
                `<ul class="c-points">${card.points.map(p => `<li>${escHtml(p)}</li>`).join('')}</ul>` +
                (card.ex ? `<div class="c-box"><div class="en">${escHtml(card.ex[0])}</div><div class="zh">${escHtml(card.ex[1])}</div></div>` : ''),
                (lessonIdx > 0 ? `<button class="btn-outline" data-go="prev">‹ 上一張</button>` : `<button class="btn-outline" data-go="chapter">‹ 章節</button>`) +
                (last ? `<button class="btn-primary" data-go="practice">開始練習 ▶</button>` : `<button class="btn-primary" data-go="next-card">下一張 ▶</button>`)
            );
        }

        /* === 測驗引擎 === */
        const PART_LIMIT = { p5: 30, p6: 40, p7: 60, p2: 20, p34: 20 };   // 弱點檢測各題型的時限（秒）
        let timerRaf = 0;

        function shuffleOpts(q) {
            // 聽力題的 A/B/C 對應語音，不洗；其他題目每次打亂選項順序
            const order = q.opts.map((_, i) => i);
            if (q.part !== 'p2' && !q.fixed) for (let i = order.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [order[i], order[j]] = [order[j], order[i]]; }
            return order;
        }

        function startQuiz(mode, chapterId, list) {
            let qs, limit = null;
            if (mode === 'diag') qs = COURSE.diagnostic.questions.slice();
            else if (mode === 'wrong') qs = list;
            else { const L = COURSE.lessons[chapterId]; qs = L[mode].slice(); limit = L.limit; }
            if (mode !== 'diag') {
                // 同一篇文章的題目要排在一起、照原本順序；文章和文章之間再打亂
                const groups = [], byKey = {};
                qs.forEach(q => { const key = q.passage || q.id; if (!byKey[key]) groups.push(byKey[key] = []); byKey[key].push(q); });
                qs = shuffleArray(groups).flat();
            }
            ui.sceneCh = mode === 'practice' || mode === 'test' ? chapterId : null;
            quiz = { mode, chapterId, qs, limit, i: 0, results: [], answered: false, order: [], t0: 0, dur: 0 };
            renderQuestion();
        }

        function startWrongReview() {
            if (!COURSE) return;
            const list = course.wrong.map(id => QINDEX[id]).filter(Boolean);
            if (!list.length) { showDialog('👍', '沒有錯題', '錯題本目前是空的，繼續保持！'); return; }
            startQuiz('wrong', null, list.slice(0, 20));
        }

        function qLimit(q) { return quiz.limit && q.part === 'p5' ? quiz.limit : (PART_LIMIT[q.part] || 30); }

        function renderQuestion() {
            const q = quiz.qs[quiz.i];
            quiz.answered = false;
            quiz.order = shuffleOpts(q);
            const label = { diag: '弱點檢測', practice: '練習', test: '章節測驗', wrong: '錯題本' }[quiz.mode];
            let passage = '';
            const talk = isTalk(q);
            if (talk) {
                // Part 3/4：先給圖表和這段的全部題目（實際考試可以先預讀），對話念完才倒數
                const p = COURSE.passages[q.passage];
                const group = quiz.qs.filter(x => x.passage === q.passage);
                const pos = group.indexOf(q);
                passage = `<div class="q-passage q-talk">${p.title ? `<span class="p-title">${escHtml(p.title)}</span>` : ''}` +
                    chartHtml(p.chart) +
                    (group.length > 1 ? `<ol class="t-qs">${group.map((x, k) => `<li class="${k === pos ? 'on' : k < pos ? 'done' : ''}">${escHtml(x.q)}</li>`).join('')}</ol>` : '') +
                    `</div>`;
            } else if (q.passage) {
                const p = COURSE.passages[q.passage];
                const blankNo = (q.q.match(/^\[(\d)\]/) || [])[1];
                // Part 6 的 [n] 是空格；Part 7 的 [n] 是插入句的位置標記
                const body = q.part === 'p6'
                    ? escHtml(p.text).replace(/\[(\d)\]/g, (m, d) => d === blankNo ? `<span class="blank">(${d}) ____</span>` : `(${d}) ____`)
                    : escHtml(p.text).replace(/\[(\d)\]/g, '<span class="mark">[$1]</span>');
                passage = `<div class="q-passage">${p.title ? `<span class="p-title">${escHtml(p.title)}</span>` : ''}${body}</div>`;
            }
            const keys = ['A', 'B', 'C', 'D'];
            const qText = q.passage && /^\[\d\]$/.test(q.q) ? `空格 ${q.q.slice(1, 2)} 該填哪一個？` : q.q.replace(/^\[\d\]\s*/, '');
            courseScreen(
                `<div class="q-top"><span class="q-count">${quiz.i + 1}/${quiz.qs.length}</span><span>${label}</span>` +
                `<div class="q-timer" id="q-timer"><i id="q-timer-fill"></i></div><span class="q-sec" id="q-sec">${q.audio || talk ? '♪' : ''}</span></div>` +
                passage +
                (q.audio ? `<button class="q-play" id="q-play">🔊 播放題目</button>` : '') +
                (talk ? `<button class="q-play" id="q-play">🔊 重播音檔</button>` : '') +
                `<p class="q-text">${escHtml(qText)}</p>` +
                `<div class="opts">${quiz.order.map((oi, k) => `<button class="opt" data-i="${k}"><span class="k">${keys[k]}</span><span>${q.part === 'p2' ? '回應 ' + escHtml(q.opts[oi]) : escHtml(q.opts[oi])}</span></button>`).join('')}</div>` +
                `<div id="q-exp"></div>`,
                `<button class="btn-outline" data-go="${quiz.mode === 'diag' || quiz.mode === 'wrong' ? 'map' : 'chapter'}">‹ 離開</button>`
            );
            quiz.dur = qLimit(q);
            if (q.audio) playQuestionAudio();
            else if (talk) {
                const first = quiz.i === 0 || quiz.qs[quiz.i - 1].passage !== q.passage;
                if (first) playTalk();
                else if (!(quiz.talk && quiz.talk.key === q.passage && quiz.talk.playing)) startTimer();   // 還在念就等念完
            } else startTimer();
        }

        function isTalk(q) { const p = q && q.passage && COURSE.passages[q.passage]; return !!(p && p.lines); }
        function chartHtml(ch) {
            if (!ch) return '';
            const cap = ch.title ? `<div class="c-cap">${escHtml(ch.title)}</div>` : '';
            if (ch.bars) {
                const max = Math.max(...ch.bars.map(b => b[1]));
                return `<div class="q-chart">${cap}<div class="bars">${ch.bars.map(([lb, v]) =>
                    `<div class="bar-row"><span class="lb">${escHtml(lb)}</span><span class="bv" style="width:${(v / max * 55).toFixed(1)}%"></span><span class="nv">${escHtml(String(v))}${escHtml(ch.unit || '')}</span></div>`).join('')}</div></div>`;
            }
            return `<div class="q-chart">${cap}${notesTable(ch)}</div>`;
        }

        // Part 3/4：整段對話／獨白，每位說話者用自己的聲音；念完才開始倒數
        let talkSeq = 0;
        function playTalk() {
            const q = quiz && quiz.qs[quiz.i];
            if (!isTalk(q)) return;
            stopTimer();
            const sec = $('q-sec'); if (sec) sec.textContent = '♪';
            if (!window.speechSynthesis) { startTimer(); return; }
            window.speechSynthesis.cancel();
            const p = COURSE.passages[q.passage], token = ++talkSeq;
            quiz.talk = { key: q.passage, playing: true, token, us: [] };   // us：保留 utterance 參考，避免被回收後 onend 不觸發
            const done = () => {
                if (!quiz || !quiz.talk || quiz.talk.token !== token) return;
                quiz.talk.playing = false;
                const cur = quiz.qs[quiz.i];
                if (!quiz.answered && cur.passage === q.passage) startTimer();
            };
            p.lines.forEach(([sp, text], k) => {
                const u = new SpeechSynthesisUtterance(text), v = speakerVoice(sp);
                if (v.voice) { u.voice = v.voice; u.lang = v.voice.lang; } else u.lang = 'en-US';
                u.pitch = v.pitch; u.rate = 0.95;
                if (k === p.lines.length - 1) { u.onend = done; u.onerror = e => { if (e.error !== 'interrupted' && e.error !== 'canceled') done(); }; }
                quiz.talk.us.push(u);
                window.speechSynthesis.speak(u);
            });
        }

        // 聽力題：念題目和三個回應，念完才開始倒數
        function playQuestionAudio() {
            const q = quiz && quiz.qs[quiz.i];
            if (isTalk(q)) { playTalk(); return; }
            if (!q || !q.audio) return;
            stopTimer();
            if (!window.speechSynthesis) { startTimer(); return; }
            window.speechSynthesis.cancel();
            q.audio.forEach((line, k) => {
                const u = makeUtterance(line);
                if (k === q.audio.length - 1) u.onend = () => { if (quiz && quiz.qs[quiz.i] === q && !quiz.answered) startTimer(); };
                window.speechSynthesis.speak(u);
            });
        }

        function startTimer() {
            stopTimer();
            quiz.t0 = performance.now();
            const tick = now => {
                if (!quiz || quiz.answered) return;
                const left = Math.max(0, quiz.dur - (now - quiz.t0) / 1000);
                const fill = $('q-timer-fill'), sec = $('q-sec'), bar = $('q-timer');
                if (fill) fill.style.width = (left / quiz.dur * 100).toFixed(1) + '%';
                if (sec) sec.textContent = Math.ceil(left) + 's';
                if (bar) bar.classList.toggle('low', left <= 5);
                if (left <= 0) { answer(-1); return; }
                timerRaf = requestAnimationFrame(tick);
            };
            timerRaf = requestAnimationFrame(tick);
        }
        function stopTimer() { cancelAnimationFrame(timerRaf); timerRaf = 0; }
        function stopQuiz() { stopTimer(); if (window.speechSynthesis) window.speechSynthesis.cancel(); quiz = null; }

        // k = 畫面上第幾個選項；-1 = 超時
        function answer(k) {
            if (!quiz || quiz.answered) return;
            const q = quiz.qs[quiz.i];
            quiz.answered = true;
            stopTimer();
            const sec = quiz.t0 ? Math.min(quiz.dur, (performance.now() - quiz.t0) / 1000) : 0;
            const chosen = k >= 0 ? quiz.order[k] : -1;
            const ok = chosen === q.a;
            quiz.results.push({ id: q.id, tag: q.tag, ok, sec, timeout: k < 0 });

            // 錯題本：答錯加入；在錯題本裡答對就移除
            const wi = course.wrong.indexOf(q.id);
            if (!ok && wi === -1) course.wrong.push(q.id);
            if (ok && quiz.mode === 'wrong' && wi !== -1) course.wrong.splice(wi, 1);
            if (ok) addXp(10);

            document.querySelectorAll('.opt').forEach((b, i) => {
                b.disabled = true;
                const oi = quiz.order[i];
                if (oi === q.a) b.classList.add('right');
                else if (i === k) b.classList.add('wrong');
                else b.classList.add('dim');
            });
            const head = k < 0 ? '⏱ 超時' : ok ? `✔ 答對了 · ${sec.toFixed(1)} 秒` : '✘ 答錯了';
            let tr = q.audio ? `<div class="tr">${escHtml(q.audio.join('\n'))}</div>` : '';
            if (isTalk(q)) {
                const p = COURSE.passages[q.passage], base = { W: '女', W2: '女 2', M: '男', M2: '男 2' };
                const who = sp => (base[sp] || sp) + (p.names && p.names[sp] ? `（${p.names[sp]}）` : '');
                tr = `<details><summary>看逐字稿和中譯</summary><div class="tr">${p.lines.map(([sp, t]) => `<span class="sp">${escHtml(who(sp))}：</span>${escHtml(t)}`).join('\n')}</div>` +
                    (p.zh ? `<div class="tr">${escHtml(p.zh)}</div>` : '') + `</details>`;
            }
            if (q.optsZh) document.querySelectorAll('.opt').forEach((b, i) => {
                b.lastElementChild.insertAdjacentHTML('beforeend', `<span class="oz">${escHtml(q.optsZh[quiz.order[i]])}</span>`);
            });
            const zh = q.zh ? `<div class="zh-line"><b>中譯</b>${escHtml(q.zh)}</div>` : '';
            $('q-exp').innerHTML = `<div class="q-exp ${ok ? 'ok' : 'ng'}"><b>${head}</b>${escHtml(q.exp)}${zh}${tr}</div>`;
            const last = quiz.i === quiz.qs.length - 1;
            $('course-foot').innerHTML =
                `<button class="btn-outline" data-go="${quiz.mode === 'diag' || quiz.mode === 'wrong' ? 'map' : 'chapter'}">‹ 離開</button>` +
                `<button class="btn-primary" data-go="next-q">${last ? '看結果 ▶' : '下一題 ▶'}</button>`;
            $('q-exp').scrollIntoView({ block: 'nearest' });
            saveCourse();
        }

        function nextQuestion() {
            if (!quiz || !quiz.answered) return;
            if (quiz.i < quiz.qs.length - 1) { quiz.i++; renderQuestion(); }
            else finishQuiz();
        }

        function finishQuiz() {
            const { mode, chapterId, results } = quiz;
            if (window.speechSynthesis) window.speechSynthesis.cancel();
            const total = results.length, score = results.filter(r => r.ok).length, acc = total ? score / total : 0;
            const avg = total ? results.reduce((s, r) => s + r.sec, 0) / total : 0;
            let body = '', foot = '';

            if (mode === 'diag') {
                const byTag = {};
                results.forEach(r => { const t = byTag[r.tag] = byTag[r.tag] || { n: 0, c: 0, sec: 0 }; t.n++; if (r.ok) t.c++; t.sec += r.sec; });
                const first = !course.diag;
                course.diag = { at: Date.now(), score, total, byTag };
                if (first) addXp(50);
                saveCourse();
                const rows = weakTags().map(t => {
                    const pct = Math.round(t.acc * 100), col = pct >= 85 ? 'var(--green)' : pct >= 60 ? 'var(--yellow)' : 'var(--red)';
                    return `<tr><td>${escHtml(COURSE.tags[t.tag].name)}</td><td class="num"><span class="r-bar"><i style="width:${pct}%;background:${col}"></i></span>${pct}%</td><td class="num">${t.sec.toFixed(1)}s</td></tr>`;
                }).join('');
                const recs = recommendedChapters().map(id => COURSE.chapters.find(c => c.id === id)).filter(Boolean);
                const slow = results.filter(r => r.ok && r.sec > (PART_LIMIT[QINDEX[r.id].part] || 30) * 0.7).length;
                body = `<div class="c-kicker">弱點檢測結果</div><div class="r-score">${score}/${total}</div>` +
                    `<p class="c-text">平均每題 ${avg.toFixed(1)} 秒${slow ? `，有 ${slow} 題雖然答對但花太久` : ''}。</p>` +
                    `<table class="r-table"><tr><th>題型</th><th>正確率</th><th>平均</th></tr>${rows}</table>` +
                    (recs.length ? `<div class="c-kicker">建議優先補強</div>${recs.map(c => `<p class="r-rec">${escHtml(c.title)}${c.kind === 'soon' ? '（即將推出）' : ''}</p>`).join('')}`
                        : `<p class="c-text">每個題型都在 85% 以上，很穩！可以直接挑戰章節測驗。</p>`);
                foot = `<button class="btn-outline" data-go="diag">再測一次</button><button class="btn-primary" data-go="map">回到地圖 ▶</button>`;
            } else if (mode === 'wrong') {
                saveCourse();
                body = `<div class="c-kicker">錯題本</div><div class="r-score">${score}/${total}</div>` +
                    `<p class="c-text">答對的題目已經從錯題本移除，還剩 ${course.wrong.length} 題。</p>`;
                foot = `<button class="btn-outline" data-go="map">回到地圖</button>` + (course.wrong.length ? `<button class="btn-primary" data-go="wrong">再複習 ▶</button>` : '');
            } else {
                const L = COURSE.lessons[chapterId], st = course.ch[chapterId] = course.ch[chapterId] || {};
                st[mode] = Math.max(st[mode] || 0, acc);
                let badge = '';
                if (mode === 'test') {
                    const pass = acc >= L.pass;
                    if (pass) {
                        const stars = acc === 1 && avg <= L.limit * 0.6 ? 3 : acc >= 0.9 ? 2 : 1;
                        if (!st.cleared) addXp(100);
                        st.cleared = true; st.stars = Math.max(st.stars || 0, stars);
                        badge = `<div class="r-badge pass">過關！${'★'.repeat(stars)}${'☆'.repeat(3 - stars)}</div>`;
                    } else badge = `<div class="r-badge fail">還差 ${Math.ceil(L.pass * total) - score} 題過關</div>`;
                }
                saveCourse();
                const wrongN = results.filter(r => !r.ok).length, toN = results.filter(r => r.timeout).length;
                // 章節有多種題型時，分開列出各題型的正確率
                const tagStat = {};
                results.forEach(r => { const t = tagStat[r.tag] = tagStat[r.tag] || { n: 0, c: 0 }; t.n++; if (r.ok) t.c++; });
                const tagRows = Object.keys(tagStat).length > 1 ? `<table class="r-table"><tr><th>題型</th><th>正確率</th></tr>${Object.entries(tagStat).map(([t, s]) => {
                    const pct = Math.round(s.c / s.n * 100), col = pct >= 85 ? 'var(--green)' : pct >= 60 ? 'var(--yellow)' : 'var(--red)';
                    return `<tr><td>${escHtml((COURSE.tags[t] || {}).name || t)}</td><td class="num"><span class="r-bar"><i style="width:${pct}%;background:${col}"></i></span>${s.c}/${s.n}</td></tr>`;
                }).join('')}</table>` : '';
                body = `<div class="c-kicker">${mode === 'test' ? '章節測驗結果' : '練習結果'}</div><div class="r-score">${score}/${total}</div>${badge}` +
                    `<p class="c-text">正確率 ${Math.round(acc * 100)}%，平均每題 ${avg.toFixed(1)} 秒（目標 ${L.limit} 秒內）。` +
                    `${wrongN ? `答錯 ${wrongN} 題${toN ? `（其中 ${toN} 題超時）` : ''}，已經放進錯題本。` : '全部答對！'}</p>` + tagRows;
                foot = mode === 'test'
                    ? `<button class="btn-outline" data-go="test">重考</button><button class="btn-primary" data-go="map">回到地圖 ▶</button>`
                    : `<button class="btn-outline" data-go="practice">再練一次</button><button class="btn-primary" data-go="test">挑戰測驗 ▶</button>`;
            }
            quiz = null;
            courseScreen(body, foot);
        }

        /* === 我的 Santa 數據（2026-11-20 從 Santa 實力分析頁抄下來的） === */
        function showSantaPage() {
            ui.sceneCh = null;
            const S = COURSE.santa;
            const bar = (v, col) => `<span class="r-bar"><i style="width:${v}%;background:${col}"></i></span>`;
            const col = me => me >= 82 ? 'var(--green)' : me >= 79 ? 'var(--yellow)' : 'var(--red)';   // 依自己的分數高低上色，紅色＝自己最弱的項目
            const rows = list => list.map(([k, me, avg]) => `<tr><td>${escHtml(k)}</td><td class="num">${bar(me, col(me))}${me}</td><td class="num">${avg}</td></tr>`).join('');
            const chName = id => (COURSE.chapters.find(c => c.id === id) || {}).title || '';
            courseScreen(
                `<div class="c-kicker">起點・資料日期 ${S.date}</div><h2 class="c-title">我的 Santa 數據</h2>` +
                `<p class="c-text">Santa 預測分數 ${S.predicted}（聽力 ${S.lc}、閱讀 ${S.rc}）。地圖上「建議優先」的章節，就是依這份數據和弱點檢測排出來的。</p>` +
                `<table class="r-table"><tr><th>能力</th><th>我的</th><th>750 分平均</th></tr>${rows(S.skills)}</table>` +
                `<table class="r-table"><tr><th>大題</th><th>我的</th><th>750 分平均</th></tr>${rows(S.parts)}</table>` +
                `<table class="r-table"><tr><th>閱讀每題時間</th><th>我的</th><th>建議</th></tr>${S.time.map(([k, me, sug]) => `<tr><td>${k}</td><td class="num">${me}s</td><td class="num">${sug}s</td></tr>`).join('')}</table>` +
                `<div class="c-kicker">較弱的概念（正確率）</div>` +
                S.weak.map(([k, me, avg, ch]) => `<p class="r-rec">${escHtml(k)}：${me}%${avg ? `（750 分平均 ${avg}%）` : ''} → ${escHtml(chName(ch))}</p>`).join('') +
                `<p class="c-text" style="margin-top:14px">解讀：速度三個 Part 都比建議快，問題不在寫不完，而在詞彙和 Part 5 的正確率。正式考 755 和預測 870 的落差，多半是考場狀況，之後用全真計時練。</p>`,
                `<button class="btn-outline" data-go="map">‹ 地圖</button>`
            );
        }

        /* === 弱點檢測說明 === */
        function showDiagIntro() {
            ui.sceneCh = null;
            const d = course.diag;
            courseScreen(
                `<div class="c-kicker">起點</div><h2 class="c-title">弱點檢測</h2>` +
                `<p class="c-text">30 題，以閱讀為主，另有 2 題聽力（會用瀏覽器語音念出來，請開聲音）。題目難度照 800–900 分程度出。</p>` +
                `<ul class="c-points"><li>每題有時限：Part 5 30 秒、Part 6 40 秒、Part 7 60 秒，超時算答錯</li>` +
                `<li>除了對錯，也會記錄每題花多久，找出「會但太慢」的題型</li><li>做完會依結果在地圖上標出建議優先的章節</li></ul>` +
                (d ? `<p class="c-text">上次成績：${d.score}/${d.total}（${new Date(d.at).toLocaleDateString('zh-TW')}）</p>` : ''),
                `<button class="btn-outline" data-go="map">‹ 地圖</button><button class="btn-primary" data-go="diag">開始檢測 ▶</button>`
            );
        }

        // 課程畫面的返回：題目中 → 確認後離開；章節內頁 → 章節首頁；其他 → 地圖
        function courseBack() {
            if (quiz && !quiz.answered && !confirm('要離開嗎？這次作答不會計算成績。')) return;
            if (quiz && quiz.mode !== 'diag' && quiz.mode !== 'wrong' && quiz.chapterId) { stopQuiz(); showChapter(ui.chapter); return; }
            if (!quiz && ui.chapter && document.querySelector('#course-body .c-dots, #course-body .n-toc')) { showChapter(ui.chapter); return; }
            showMap();
        }

        function courseKey(e) {
            if (quiz) {
                const q = quiz.qs[quiz.i];
                const map = { '1': 0, '2': 1, '3': 2, '4': 3, a: 0, b: 1, c: 2, d: 3 };
                const k = map[e.key.toLowerCase()];
                if (!quiz.answered && k != null && k < q.opts.length) { e.preventDefault(); answer(k); return; }
                if (quiz.answered && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); nextQuestion(); return; }
                if ((q.audio || isTalk(q)) && e.key.toLowerCase() === 'p') { playQuestionAudio(); return; }
                return;
            }
            if (e.code === 'ArrowRight' && document.querySelector('#course-body .c-dots')) showLesson(lessonIdx + 1);
            if (e.code === 'ArrowLeft' && document.querySelector('#course-body .c-dots')) showLesson(lessonIdx - 1);
        }

        /* === Init === */
        window.addEventListener('DOMContentLoaded', async () => {
            course = normalizeCourse(await loadCourseLocal());
            let saved = await loadStateLocal();
            if (saved && saved.cards && saved.cards.length > 0) {
                appState = normalizeState(saved);
                sanitizeState();
            }

            if (syncId) {
                $('icon-cloud-off').classList.add('hidden');
                $('icon-cloud-on').classList.remove('hidden');
            }

            // 第一次造訪、本機儲存被清除過、或內建單字庫有更新時，自動載入內建單字庫，
            // 不用每台設備都手動匯入一次 CSV（自己匯入的 CSV 不會被換掉）
            if (appState.vocabSig !== 'custom') {
                try {
                    const rows = await fetchDefaultRows();
                    const sig = vocabSignature(rows);
                    if (appState.cards.length === 0 || appState.vocabSig !== sig) {
                        showLoadingScreen();
                        await loadCardsFromRows(rows, sig);
                    }
                } catch (e) {
                    console.error('自動載入單字庫失敗', e);
                }
            }

            // Try fetching latest cloud progress on boot
            if (syncId && appState.cards.length > 0) {
                await loadFromCloud(syncId);
                sanitizeState();
            }

            // 首頁是闖關地圖
            ui.loading = false;
            elFront.classList.remove('loading');
            try { await loadCourseData(); } catch (e) { console.error('課程載入失敗', e); }
            showMap();
        });
    </script>
</body>
</html>
